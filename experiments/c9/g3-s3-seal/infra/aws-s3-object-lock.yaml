AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  REVIEW-ONLY: dedicated AWS account S3 Object Lock COMPLIANCE storage for AgentHub
  C9 G3 seal. This creates billable, intentionally non-deletable retained versions.
Parameters:
  SealBucketName:
    Type: String
    Description: Globally unique bucket name in a separately administered AWS account
    AllowedPattern: '^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$'
  RetentionDays:
    Type: Number
    Default: 3650
    MinValue: 365
    MaxValue: 36500
    Description: Irreversible COMPLIANCE retention on each object version
Resources:
  SealBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref SealBucketName
      VersioningConfiguration:
        Status: Enabled
      ObjectLockEnabled: true
      ObjectLockConfiguration:
        ObjectLockEnabled: Enabled
        Rule:
          DefaultRetention:
            Mode: COMPLIANCE
            Days: !Ref RetentionDays
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
  SealBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SealBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyPlaintextTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt SealBucket.Arn
              - !Sub '${SealBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'
          - Sid: DenyObjectDeletesAndMarkers
            Effect: Deny
            Principal: '*'
            Action:
              - 's3:DeleteObject'
              - 's3:DeleteObjectVersion'
            Resource: !Sub '${SealBucket.Arn}/*'
  SealSigningKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: AgentHub C9 external seal receipt signer; SIGN_VERIFY, not encryption
      KeyUsage: SIGN_VERIFY
      KeySpec: ECC_NIST_P256
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: AccountRootOwnsKeyPolicy
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action: 'kms:*'
            Resource: '*'
Outputs:
  BucketName:
    Value: !Ref SealBucket
  DedicatedAccountId:
    Value: !Ref AWS::AccountId
  Region:
    Value: !Ref AWS::Region
  SignerKeyArn:
    Value: !GetAtt SealSigningKey.Arn
