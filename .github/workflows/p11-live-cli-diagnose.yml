name: P11 live CLI diagnose

on:
  push:
    branches:
      - agent/reference-graph-p11
    paths:
      - .github/workflows/p11-live-cli-diagnose.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Diagnose one production CLI case
        run: |
          export SUPABASE_URL='https://vrznfnxzlxaavpqbzbzd.supabase.co'
          export SUPABASE_PUBLISHABLE_KEY="$(python3 - <<'PY'
          from pathlib import Path
          import re
          text = Path('.github/workflows/p11-live-activation-canary.yml').read_text()
          match = re.search(r'^\s*SUPABASE_PUBLISHABLE_KEY:\s*(\S+)\s*$', text, re.M)
          if not match:
              raise SystemExit('publishable canary value not found')
          print(match.group(1))
          PY
          )"
          node reference-graph/p11-cli-live-diff.mjs
