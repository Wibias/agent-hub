name: C9 G3 offline authorization contract (review only)
on:
  push:
    branches: [codex/c9-g3-offline-review]
    paths:
      - 'experiments/c9/g3-offline/**'
      - '.github/workflows/verify-c9-g3-offline.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  g3-offline:
    runs-on: windows-2022
    timeout-minutes: 10
    defaults:
      run:
        working-directory: experiments/c9/g3-offline
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.100'
      - name: Verify pinned SDK and isolated offline negative tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sdk = (dotnet --version).Trim()
          if ($sdk -cne '10.0.100') { throw "Unexpected SDK: $sdk" }
          dotnet run --project tests/AgentHub.C9.G3.Tests.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { throw "G3 offline tests failed: $LASTEXITCODE" }
          Write-Host "C9_G3_OFFLINE_REVIEW_PASS SHA=$env:GITHUB_SHA SDK=$sdk"
          Write-Host 'NO_ISSUER_PROVISIONED NO_SCM NO_KEY_ENROLLED G3_HOLD PRODUCTION_NO_GO'
