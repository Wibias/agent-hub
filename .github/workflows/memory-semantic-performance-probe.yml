name: Memory semantic performance probe\n\non:\n  push:\n    branches:\n      - "bench/memory-engine-performance"\n    paths:\n      - "scripts/benchmark-memory-semantic.mjs"\n      - ".github/workflows/memory-semantic-performance-probe.yml"\n      - "memory-engine/**"\n  workflow_dispatch:\n\npermissions:\n  contents: read\n\njobs:\n  benchmark:\n    runs-on: ubuntu-24.04\n    timeout-minutes: 45\n    steps:\n      - name: Checkout\n        uses: actions/checkout@v4\n\n      - name: Use Node 24\n        uses: actions/setup-node@v4\n        with:\n          node-version: 24\n\n      - name: Install memory engine provider dependencies\n        run: npm ci --prefix memory-engine\n\n      - name: Restore pinned E5 model cache\n        id: e5-cache\n        uses: actions/cache@v4\n        with:\n          path: .cache/memory-engine/e5\n          key: ${{ runner.os }}-memory-e5-${{ hashFiles('memory-engine/package-lock.json') }}-fd1525a9fd15316a2d503bf26ab031a61d056e98\n\n      - name: Prepare pinned E5 model cache\n        if: steps.e5-cache.outputs.cache-hit != 'true'\n        run: |\n          node scripts/prepare-memory-embedding-model.mjs \\n            --cache-dir .cache/memory-engine/e5\n\n      - name: Recheck real semantic quality gate\n        env:\n          MEMORY_E5_MODEL_CACHE: .cache/memory-engine/e5\n        run: node --test tests/memory-engine/e5-semantic-eval.test.mjs\n\n      - name: Run semantic performance probe\n        env:\n          MEMORY_E5_MODEL_CACHE: .cache/memory-engine/e5\n        run: node --expose-gc scripts/benchmark-memory-semantic.mjs\n