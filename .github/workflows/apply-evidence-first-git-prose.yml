name: Apply evidence-first Git prose

on:
  push:
    branches:
      - feat/evidence-first-git-prose

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply policy edits
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"expected exactly one match in {path}, found {text.count(old)}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'AGENTS.md',
              'Work from outcome, constraints, and verification.\n\n* Act directly on clearly scoped, reversible local work.',
              'Work from outcome, constraints, and verification.\n\nSeparate substance from presentation. Establish the correct outcome, facts, evidence, and required content before applying artifact-specific prose guidance. Do not load or apply broad style profiles globally when a narrower artifact owner can shape the final text.\n\n* Act directly on clearly scoped, reversible local work.',
          )

          replace_once(
              'skills/github-delivery/references/git-workflow.md',
              "Use the repository's existing commit-message convention first. When no project convention exists, prefer a concise imperative description of the logical effect, optionally with a familiar type such as `feat:`, `fix:`, `refactor:`, `test:`, `docs:`, or `chore:`.\n\nA useful message answers what outcome the commit establishes. Add a body when the reason, compatibility tradeoff, security boundary, migration constraint, or non-obvious decision would otherwise be lost. Do not invent issue IDs, changelog claims, or breaking-change markers that are not supported by the change.",
              "Use the repository's existing commit-message convention first. Derive the message from the staged diff, or the current diff when staging is not yet final, plus the relevant repository context and logical unit being committed. Establish the facts and meaning before prose cleanup: identify the logical effect, the reason for it, and any reviewer-relevant constraint or consequence.\n\nWhen no project convention exists, prefer a concise imperative description of the logical effect, optionally with a familiar type such as `feat:`, `fix:`, `refactor:`, `test:`, `docs:`, or `chore:`. A useful subject passes the completion test: `If applied, this commit will <subject>`. Add a body when the rationale, compatibility tradeoff, security boundary, migration constraint, or non-obvious decision would otherwise be lost.\n\nAfter the substance is established, apply `references/prose-quality.md` as a final readability pass. Preserve repository terminology, exact evidence, and uncertainty; do not invent issue IDs, changelog claims, motivation, or breaking-change markers that are not supported by the change.",
          )

          replace_once(
              'skills/github-delivery/references/prose-quality.md',
              '# Prose quality for durable GitHub text\n\nUse this companion when `github-delivery` authors durable prose: PR descriptions,\nissue bodies, PRDs, review/status comments, merge-ready summaries, and other\nGitHub text that is not required to remain exact user-authored wording.\n\nThis layer improves readability only. Evidence, policy, template shape, security\nredaction, exact GitHub syntax, and exact user-confirmed text always win over\nstyle cleanup.',
              '# Prose quality for durable Git and GitHub text\n\nUse this companion when `github-delivery` authors durable prose: commit messages,\nPR descriptions, issue bodies, PRDs, review/status comments, merge-ready summaries,\nand other Git or GitHub text that is not required to remain exact user-authored wording.\n\nEstablish the facts, required content, and intended meaning before applying this layer.\nThis layer improves readability only. Evidence, policy, template shape, security\nredaction, exact GitHub syntax, and exact user-confirmed text always win over\nstyle cleanup.',
          )

          replace_once(
              'skills/github-delivery/references/prose-quality.md',
              '## Artifact-specific guidance\n\n### PR descriptions and review comments',
              "## Artifact-specific guidance\n\n### Commit messages\n\nKeep the repository's established convention. Preserve the logical effect and any\nreviewer-relevant rationale established by `references/git-workflow.md`; this pass\nmay simplify wording, but it must not turn the subject into a generic summary,\nadd unsupported motivation, or optimize for whether the text appears human-written.\n\n### PR descriptions and review comments",
          )

          eval_path = Path('skills/github-delivery/tests/evals/cases.jsonl')
          rows = [json.loads(line) for line in eval_path.read_text().splitlines() if line.strip()]
          if any(row.get('id') == 'E5' for row in rows):
              raise SystemExit('E5 already exists')
          rows.append({
              'id': 'E5',
              'category': 'routing',
              'invocation': 'implicit',
              'prompt': 'Prepare a commit message for the staged change. Read the staged diff and repository convention first, state the logical effect in the subject, preserve non-obvious rationale in the body when the diff cannot recover it, then do only a final readability cleanup. Do not optimize for whether the result sounds human and do not invent motivation or issue metadata.',
              'expected_skill': 'github-delivery',
              'expected_resources': ['SKILL.md', 'references/git-workflow.md', 'references/prose-quality.md'],
              'unnecessary_resources': ['references/shared-rules.md'],
              'assertion_ids': ['commit-message-grounded-in-diff', 'commit-message-logical-effect-clear', 'commit-message-rationale-preserved', 'prose-cleanup-after-substance', 'no-human-likeness-metric', 'no-unsupported-motivation'],
              'scenario': 'Commit-message quality is judged by recoverable effect and rationale grounded in repository evidence, with prose shaping applied only after substance is established.',
          })
          eval_path.write_text('\n'.join(json.dumps(row, separators=(',', ':')) for row in rows) + '\n')

          replace_once(
              'skills/github-delivery/CHANGELOG.md',
              '## [Unreleased]\n',
              '## [Unreleased]\n\n### Changed\n\n- Commit-message guidance now derives the logical effect and non-obvious rationale from the staged/current diff before applying the existing prose-quality layer, and the canonical eval set measures reviewer utility rather than human-likeness.\n',
          )
          PY
      - name: Verify focused contract
        run: node --test tests/skill-catalog/evidence-first-git-prose.test.mjs
      - name: Remove temporary applier
        run: rm .github/workflows/apply-evidence-first-git-prose.yml
      - name: Commit applied change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AGENTS.md skills/github-delivery tests/skill-catalog/evidence-first-git-prose.test.mjs .github/workflows/apply-evidence-first-git-prose.yml
          git commit -m "Clarify evidence-first Git prose guidance"
          git push origin HEAD:feat/evidence-first-git-prose
