name: Memory Legacy Candidate Private One-File Export D12.3

on:
  pull_request:
    paths:
      - "scripts/export-memory-legacy-candidates-private.mjs"
      - "tests/memory-engine/memory-private-legacy-candidate-export.test.mjs"
      - "docs/memory-d12-3-private-legacy-candidate-export.md"
      - ".github/workflows/verify-memory-private-legacy-export.yml"
  push:
    branches: [main]
    paths:
      - "scripts/export-memory-legacy-candidates-private.mjs"
      - "tests/memory-engine/memory-private-legacy-candidate-export.test.mjs"
      - "docs/memory-d12-3-private-legacy-candidate-export.md"
      - ".github/workflows/verify-memory-private-legacy-export.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Test bounded private export and read-only database behavior
        run: |
          node --check scripts/export-memory-legacy-candidates-private.mjs
          node --test tests/memory-engine/memory-private-legacy-candidate-export.test.mjs
