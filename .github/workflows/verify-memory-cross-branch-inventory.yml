name: Memory Cross-branch Metadata Inventory D12.3

on:
  pull_request:
    paths:
      - "scripts/inspect-memory-cross-branch-metadata.mjs"
      - "tests/memory-engine/memory-cross-branch-metadata-inventory.test.mjs"
      - "docs/memory-d12-3-cross-branch-metadata-inventory.md"
      - ".github/workflows/verify-memory-cross-branch-inventory.yml"
  push:
    branches: [main]
    paths:
      - "scripts/inspect-memory-cross-branch-metadata.mjs"
      - "tests/memory-engine/memory-cross-branch-metadata-inventory.test.mjs"
      - "docs/memory-d12-3-cross-branch-metadata-inventory.md"
      - ".github/workflows/verify-memory-cross-branch-inventory.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Verify cross-branch inventory privacy and complete enumeration
        run: |
          node --check scripts/inspect-memory-cross-branch-metadata.mjs
          node --test tests/memory-engine/memory-cross-branch-metadata-inventory.test.mjs
