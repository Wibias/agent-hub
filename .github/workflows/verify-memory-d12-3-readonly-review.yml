name: Memory D12.3 scoped read-only review

on:
  pull_request:
    paths:
      - 'scripts/inspect-memory-*.mjs'
      - 'tests/memory-engine/memory-*review*.test.mjs'
      - 'tests/memory-engine/memory-unresolved-proposals-audit.test.mjs'
      - 'tests/memory-engine/memory-project-scope-readonly-audit.test.mjs'
      - 'tests/memory-engine/memory-cross-branch-metadata-inventory.test.mjs'
      - 'docs/memory-d12-3-*.md'
      - '.github/workflows/verify-memory-d12-3-readonly-review.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/inspect-memory-*.mjs'
      - 'tests/memory-engine/memory-*review*.test.mjs'
      - 'tests/memory-engine/memory-unresolved-proposals-audit.test.mjs'
      - 'tests/memory-engine/memory-project-scope-readonly-audit.test.mjs'
      - 'tests/memory-engine/memory-cross-branch-metadata-inventory.test.mjs'
      - '.github/workflows/verify-memory-d12-3-readonly-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read-only-review:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Read-only review, scope, privacy and legacy-schema regressions
        run: >-
          node --test
          tests/memory-engine/memory-unresolved-proposals-audit.test.mjs
          tests/memory-engine/memory-local-proposal-evidence-review.test.mjs
          tests/memory-engine/memory-project-scope-readonly-audit.test.mjs
          tests/memory-engine/memory-cross-branch-metadata-inventory.test.mjs
          tests/memory-engine/memory-cross-branch-proposal-evidence-review.test.mjs
