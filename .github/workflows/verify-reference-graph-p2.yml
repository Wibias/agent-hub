name: Reference Graph P2 verification

on:
  push:
    branches:
      - agent/reference-graph-p2

permissions:
  contents: read

concurrency:
  group: reference-graph-p2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Test Reference Graph P0-P2 contracts
        run: node --test tests/reference-graph/*.test.mjs

      - name: Diagnose legacy control freshness health
        run: |
          node --input-type=module <<'NODE'
          import { isFresh, loadRecords } from './knowledge/design-references/scripts/lib.mjs';
          const records = loadRecords();
          const reviewedAccessible = records.filter(
            (row) => row.reviewStatus === 'reviewed' && ['AVAILABLE', 'PAYWALLED'].includes(row.accessStatus),
          );
          const maxVerified = reviewedAccessible
            .map((row) => row.lastVerifiedAt)
            .sort()
            .at(-1);
          const snapshotNow = new Date(`${maxVerified}T12:00:00Z`);
          const currentFresh = reviewedAccessible.filter((row) => isFresh(row));
          const snapshotFresh = reviewedAccessible.filter((row) => isFresh(row, snapshotNow));
          const bySurface = (rows) => Object.fromEntries(
            [...new Set(rows.map((row) => row.surfaceFamily))]
              .sort()
              .map((surface) => [surface, rows.filter((row) => row.surfaceFamily === surface).length]),
          );
          const byPlatform = (rows) => Object.fromEntries(
            [...new Set(rows.map((row) => row.platform))]
              .sort()
              .map((platform) => [platform, rows.filter((row) => row.platform === platform).length]),
          );
          console.log(JSON.stringify({
            total_records: records.length,
            reviewed_accessible: reviewedAccessible.length,
            max_last_verified_at: maxVerified,
            current_fresh_count: currentFresh.length,
            current_fresh_ids: currentFresh.map((row) => row.id),
            current_fresh_by_surface: bySurface(currentFresh),
            current_fresh_by_platform: byPlatform(currentFresh),
            snapshot_fresh_count: snapshotFresh.length,
            snapshot_fresh_by_surface: bySurface(snapshotFresh),
            snapshot_fresh_by_platform: byPlatform(snapshotFresh),
          }, null, 2));
          NODE

      - name: Diagnose legacy-control eligibility against graph hard filters
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { loadRecords } from './knowledge/design-references/scripts/lib.mjs';
          import { selectRecords } from './knowledge/design-references/scripts/selection.mjs';
          const cases = JSON.parse(fs.readFileSync('./reference-graph/shadow-cases.json', 'utf8'));
          const records = loadRecords();
          const rows = cases.map((request) => {
            const selected = selectRecords(records, request).selected;
            const exactSurface = selected.filter((row) => row.surfaceFamily === request.surface).length;
            const exactPlatform = selected.filter((row) => row.platform === request.platform).length;
            const exactBoth = selected.filter(
              (row) => row.surfaceFamily === request.surface && row.platform === request.platform,
            ).length;
            return {
              id: request.id,
              selected: selected.length,
              exact_surface: exactSurface,
              exact_platform: exactPlatform,
              exact_both: exactBoth,
              legacy_ids: selected.map((row) => row.id),
            };
          });
          const totals = rows.reduce((out, row) => {
            out.selected += row.selected;
            out.exact_surface += row.exact_surface;
            out.exact_platform += row.exact_platform;
            out.exact_both += row.exact_both;
            if (row.exact_both === 0) out.cases_with_zero_exact_both += 1;
            return out;
          }, {
            selected: 0,
            exact_surface: 0,
            exact_platform: 0,
            exact_both: 0,
            cases_with_zero_exact_both: 0,
          });
          console.log(JSON.stringify({ totals, rows }, null, 2));
          NODE
