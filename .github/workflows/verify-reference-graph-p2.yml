name: Reference Graph P2 verification

on:
  push:
    branches:
      - agent/reference-graph-p2

permissions:
  contents: read

concurrency:
  group: reference-graph-p2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Test Reference Graph P0-P2 contracts
        run: node --test tests/reference-graph/*.test.mjs

      - name: Measure healthy lexical snapshot baseline
        run: |
          node reference-graph/cli/shadow-design-references.mjs \
            --offline \
            --control-date 2026-07-21 > /tmp/snapshot-lexical.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const value = JSON.parse(fs.readFileSync('/tmp/snapshot-lexical.json', 'utf8'));
          console.log(JSON.stringify({
            control_reference_time: value.control_reference_time,
            benchmark_control_health: value.control_health,
            current_control_health: value.current_control_health,
            lexical_summary: value.summary,
          }, null, 2));
          if (!value.control_health?.healthy) throw new Error('snapshot control must be healthy');
          if (value.current_control_health?.healthy) throw new Error('current control should expose stale-catalog health');
          NODE

      - name: Start Ollama
        run: |
          docker run -d --name reference-graph-ollama -p 11434:11434 ollama/ollama:latest
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:11434/api/version; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              docker logs reference-graph-ollama
              exit 1
            fi
            sleep 1
          done

      - name: Pull pinned Snowflake Arctic small model
        run: |
          curl -fsS http://127.0.0.1:11434/api/pull \
            -H 'content-type: application/json' \
            -d '{"model":"snowflake-arctic-embed:33m","stream":false}'
          node --input-type=module <<'NODE'
          import { OllamaEmbeddingProvider } from './reference-graph/ollama-embeddings.mjs';
          const provider = new OllamaEmbeddingProvider({
            modelTag: 'snowflake-arctic-embed:33m',
            modelRevision: 'e8db018629b4',
          });
          const digest = await provider.verifyModel();
          const [embedding] = await provider.embed(['Reference Graph retrieval-model smoke test']);
          console.log(JSON.stringify({
            model_id: provider.modelId,
            model_revision: provider.modelRevision,
            verified_digest: digest,
            dimensions: embedding.length,
          }, null, 2));
          NODE

      - name: Probe Arctic semantic and hybrid with query-only retrieval prefix
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { loadRecords } from './knowledge/design-references/scripts/lib.mjs';
          import { planLegacyCatalogImport } from './reference-graph/catalog-import.mjs';
          import { buildEmbeddingRows } from './reference-graph/embedding-pipeline.mjs';
          import { OllamaEmbeddingProvider } from './reference-graph/ollama-embeddings.mjs';
          import { createOfflineEmbeddedRetriever } from './reference-graph/semantic-shadow.mjs';
          import { runCatalogShadowEvaluation } from './reference-graph/shadow-eval.mjs';

          const QUERY_PREFIX = 'Represent this sentence for searching relevant passages: ';
          const cases = JSON.parse(fs.readFileSync('./reference-graph/shadow-cases.json', 'utf8'));
          const lexical = JSON.parse(fs.readFileSync('/tmp/snapshot-lexical.json', 'utf8'));
          const records = loadRecords();
          const plan = planLegacyCatalogImport(records);
          const documentProvider = new OllamaEmbeddingProvider({
            modelTag: 'snowflake-arctic-embed:33m',
            modelRevision: 'e8db018629b4',
          });
          const embeddingRows = await buildEmbeddingRows({
            captures: plan.captures,
            provider: documentProvider,
            batchSize: 32,
          });
          const queryProvider = {
            modelId: documentProvider.modelId,
            modelRevision: documentProvider.modelRevision,
            embed(texts) {
              return documentProvider.embed(texts.map((text) => `${QUERY_PREFIX}${text}`));
            },
          };
          const semanticRetrieve = createOfflineEmbeddedRetriever({
            captures: plan.captures,
            embeddingRows,
            provider: queryProvider,
            mode: 'semantic',
          });
          const hybridRetrieve = createOfflineEmbeddedRetriever({
            captures: plan.captures,
            embeddingRows,
            provider: queryProvider,
            mode: 'hybrid',
          });
          const controlNow = new Date('2026-07-21T12:00:00.000Z');
          const semantic = await runCatalogShadowEvaluation({
            records,
            cases,
            graphRetrieve: semanticRetrieve,
            controlNow,
          });
          const hybrid = await runCatalogShadowEvaluation({
            records,
            cases,
            graphRetrieve: hybridRetrieve,
            controlNow,
          });
          const delta = (candidate, baseline, field) => candidate.summary[field] - baseline.summary[field];
          const evidence = {
            model_id: documentProvider.modelId,
            model_revision: documentProvider.modelRevision,
            query_prefix: QUERY_PREFIX,
            embedding_count: embeddingRows.length,
            lexical: lexical.summary,
            semantic: semantic.summary,
            hybrid: hybrid.summary,
            semantic_vs_lexical: {
              average_overlap_delta: delta(semantic, lexical, 'average_overlap_at_k'),
              top1_retention_delta: delta(semantic, lexical, 'legacy_top1_retention_rate'),
            },
            hybrid_vs_lexical: {
              average_overlap_delta: delta(hybrid, lexical, 'average_overlap_at_k'),
              top1_retention_delta: delta(hybrid, lexical, 'legacy_top1_retention_rate'),
            },
          };
          evidence.semantic_vs_lexical.retrieval_progress =
            evidence.semantic_vs_lexical.average_overlap_delta > 0
            || evidence.semantic_vs_lexical.top1_retention_delta > 0;
          evidence.hybrid_vs_lexical.retrieval_progress =
            evidence.hybrid_vs_lexical.average_overlap_delta > 0
            || evidence.hybrid_vs_lexical.top1_retention_delta > 0;
          console.log(JSON.stringify(evidence, null, 2));
          NODE
