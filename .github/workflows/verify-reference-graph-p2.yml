name: Reference Graph P2 verification

on:
  push:
    branches:
      - agent/reference-graph-p2

permissions:
  contents: read

concurrency:
  group: reference-graph-p2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Test Reference Graph P0-P2 contracts
        run: node --test tests/reference-graph/*.test.mjs

      - name: Diagnose legacy-control eligibility against graph hard filters
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { loadRecords } from './knowledge/design-references/scripts/lib.mjs';
          import { selectRecords } from './knowledge/design-references/scripts/selection.mjs';
          const cases = JSON.parse(fs.readFileSync('./reference-graph/shadow-cases.json', 'utf8'));
          const records = loadRecords();
          const rows = cases.map((request) => {
            const selected = selectRecords(records, request).selected;
            const exactSurface = selected.filter((row) => row.surfaceFamily === request.surface).length;
            const exactPlatform = selected.filter((row) => row.platform === request.platform).length;
            const exactBoth = selected.filter(
              (row) => row.surfaceFamily === request.surface && row.platform === request.platform,
            ).length;
            return {
              id: request.id,
              selected: selected.length,
              exact_surface: exactSurface,
              exact_platform: exactPlatform,
              exact_both: exactBoth,
              legacy_ids: selected.map((row) => row.id),
            };
          });
          const totals = rows.reduce((out, row) => {
            out.selected += row.selected;
            out.exact_surface += row.exact_surface;
            out.exact_platform += row.exact_platform;
            out.exact_both += row.exact_both;
            if (row.exact_both === 0) out.cases_with_zero_exact_both += 1;
            return out;
          }, {
            selected: 0,
            exact_surface: 0,
            exact_platform: 0,
            exact_both: 0,
            cases_with_zero_exact_both: 0,
          });
          console.log(JSON.stringify({ totals, rows }, null, 2));
          NODE

      - name: Start Ollama
        run: |
          docker run -d --name reference-graph-ollama -p 11434:11434 ollama/ollama:latest
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:11434/api/version; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              docker logs reference-graph-ollama
              exit 1
            fi
            sleep 1
          done

      - name: Pull pinned all-minilm model
        run: |
          curl -fsS http://127.0.0.1:11434/api/pull \
            -H 'content-type: application/json' \
            -d '{"model":"all-minilm:22m-l6-v2-fp16","stream":false}'
          node --input-type=module <<'NODE'
          import { OllamaEmbeddingProvider } from './reference-graph/ollama-embeddings.mjs';
          const provider = new OllamaEmbeddingProvider();
          const digest = await provider.verifyModel();
          const [embedding] = await provider.embed(['Reference Graph real-model smoke test']);
          console.log(JSON.stringify({
            model_id: provider.modelId,
            model_revision: provider.modelRevision,
            verified_digest: digest,
            dimensions: embedding.length,
          }, null, 2));
          NODE

      - name: Measure lexical, semantic, and hybrid shadow evidence
        run: |
          node reference-graph/cli/shadow-design-references.mjs --offline > /tmp/lexical.json
          node reference-graph/cli/shadow-design-references.mjs --ollama-semantic > /tmp/semantic.json
          node reference-graph/cli/shadow-design-references.mjs --ollama-hybrid > /tmp/hybrid.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const read = (path) => JSON.parse(fs.readFileSync(path, 'utf8'));
          const lexical = read('/tmp/lexical.json');
          const semantic = read('/tmp/semantic.json');
          const hybrid = read('/tmp/hybrid.json');
          const pick = (value) => ({
            mode: value.mode,
            semantic_enabled: value.semantic_enabled,
            model_id: value.model_id,
            model_revision: value.model_revision,
            summary: value.summary,
          });
          const overlapDelta = hybrid.summary.average_overlap_at_k - lexical.summary.average_overlap_at_k;
          const top1Delta = hybrid.summary.legacy_top1_retention_rate - lexical.summary.legacy_top1_retention_rate;
          console.log(JSON.stringify({
            lexical: pick(lexical),
            semantic: pick(semantic),
            hybrid: pick(hybrid),
            hybrid_vs_lexical: {
              average_overlap_delta: overlapDelta,
              top1_retention_delta: top1Delta,
              retrieval_progress: overlapDelta > 0 || top1Delta > 0,
            },
          }, null, 2));
          NODE
