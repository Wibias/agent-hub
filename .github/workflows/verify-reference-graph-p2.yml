name: Reference Graph P2 verification

on:
  push:
    branches:
      - agent/reference-graph-p2

permissions:
  contents: read

concurrency:
  group: reference-graph-p2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Test Reference Graph P0-P2 contracts
        run: node --test tests/reference-graph/*.test.mjs

      - name: Measure healthy lexical snapshot baseline
        run: |
          node reference-graph/cli/shadow-design-references.mjs \
            --offline \
            --control-date 2026-07-21 > /tmp/snapshot-lexical.json

      - name: Start Ollama
        run: |
          docker run -d --name reference-graph-ollama -p 11434:11434 ollama/ollama:latest
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:11434/api/version; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              docker logs reference-graph-ollama
              exit 1
            fi
            sleep 1
          done

      - name: Pull pinned Snowflake Arctic small model
        run: |
          curl -fsS http://127.0.0.1:11434/api/pull \
            -H 'content-type: application/json' \
            -d '{"model":"snowflake-arctic-embed:33m","stream":false}'
          node --input-type=module <<'NODE'
          import { OllamaEmbeddingProvider } from './reference-graph/ollama-embeddings.mjs';
          const provider = new OllamaEmbeddingProvider({
            modelTag: 'snowflake-arctic-embed:33m',
            modelRevision: 'e8db018629b4',
          });
          const digest = await provider.verifyModel();
          const [embedding] = await provider.embed(['Reference Graph retrieval-model smoke test']);
          console.log(JSON.stringify({ verified_digest: digest, dimensions: embedding.length }, null, 2));
          NODE

      - name: Probe document representation variants
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { loadRecords } from './knowledge/design-references/scripts/lib.mjs';
          import { planLegacyCatalogImport } from './reference-graph/catalog-import.mjs';
          import { buildEmbeddingRows } from './reference-graph/embedding-pipeline.mjs';
          import { OllamaEmbeddingProvider } from './reference-graph/ollama-embeddings.mjs';
          import { createOfflineEmbeddedRetriever } from './reference-graph/semantic-shadow.mjs';
          import { runCatalogShadowEvaluation } from './reference-graph/shadow-eval.mjs';

          const QUERY_PREFIX = 'Represent this sentence for searching relevant passages: ';
          const controlNow = new Date('2026-07-21T12:00:00.000Z');
          const cases = JSON.parse(fs.readFileSync('./reference-graph/shadow-cases.json', 'utf8'));
          const lexical = JSON.parse(fs.readFileSync('/tmp/snapshot-lexical.json', 'utf8'));
          const records = loadRecords();
          const recordById = new Map(records.map((record) => [record.id, record]));
          const plan = planLegacyCatalogImport(records);
          const provider = new OllamaEmbeddingProvider({
            modelTag: 'snowflake-arctic-embed:33m',
            modelRevision: 'e8db018629b4',
          });
          const queryProvider = {
            modelId: provider.modelId,
            modelRevision: provider.modelRevision,
            embed(texts) {
              return provider.embed(texts.map((text) => `${QUERY_PREFIX}${text}`));
            },
          };
          const compact = (values) => values
            .flatMap((value) => Array.isArray(value) ? value : [value])
            .filter((value) => typeof value === 'string' && value.trim().length > 0)
            .map((value) => value.trim());
          const decisionText = (record) => compact([
            record.firstScreenJob,
            record.topology,
            record.visualWorld,
            record.strengths,
            record.transferableDecisions,
            record.tags,
          ]).join('\n');
          const structuredText = (record) => [
            `Page role: ${record.pageRole}`,
            `First-screen job: ${record.firstScreenJob}`,
            `Topology: ${record.topology}`,
            `Visual world: ${record.visualWorld}`,
            `Strengths: ${compact(record.strengths).join('; ')}`,
            `Transferable decisions: ${compact(record.transferableDecisions).join('; ')}`,
            `Flow states: ${compact(record.flowStates).join('; ')}`,
            `Tags: ${compact(record.tags).join('; ')}`,
          ].join('\n');
          const variantCaptures = (buildText) => plan.captures.map((capture) => {
            const legacyId = capture.asset.metadata.legacy_id;
            const record = recordById.get(legacyId);
            if (!record) throw new Error(`missing record for ${legacyId}`);
            return {
              ...capture,
              chunks: capture.chunks.map((chunk) => ({
                ...chunk,
                content: buildText(record),
              })),
            };
          });
          async function evaluateVariant(name, embeddingCaptures) {
            const embeddingRows = await buildEmbeddingRows({
              captures: embeddingCaptures,
              provider,
              batchSize: 32,
            });
            const semanticRetrieve = createOfflineEmbeddedRetriever({
              captures: plan.captures,
              embeddingRows,
              provider: queryProvider,
              mode: 'semantic',
            });
            const hybridRetrieve = createOfflineEmbeddedRetriever({
              captures: plan.captures,
              embeddingRows,
              provider: queryProvider,
              mode: 'hybrid',
            });
            const semantic = await runCatalogShadowEvaluation({ records, cases, graphRetrieve: semanticRetrieve, controlNow });
            const hybrid = await runCatalogShadowEvaluation({ records, cases, graphRetrieve: hybridRetrieve, controlNow });
            return {
              name,
              semantic: semantic.summary,
              hybrid: hybrid.summary,
            };
          }
          const variants = [];
          variants.push(await evaluateVariant('decision-focused', variantCaptures(decisionText)));
          variants.push(await evaluateVariant('structured-decision', variantCaptures(structuredText)));
          const delta = (candidate, field) => candidate[field] - lexical.summary[field];
          for (const variant of variants) {
            variant.semantic_vs_lexical = {
              average_overlap_delta: delta(variant.semantic, 'average_overlap_at_k'),
              top1_retention_delta: delta(variant.semantic, 'legacy_top1_retention_rate'),
            };
            variant.hybrid_vs_lexical = {
              average_overlap_delta: delta(variant.hybrid, 'average_overlap_at_k'),
              top1_retention_delta: delta(variant.hybrid, 'legacy_top1_retention_rate'),
            };
          }
          console.log(JSON.stringify({
            model_id: provider.modelId,
            model_revision: provider.modelRevision,
            query_prefix: QUERY_PREFIX,
            lexical: lexical.summary,
            variants,
          }, null, 2));
          NODE
