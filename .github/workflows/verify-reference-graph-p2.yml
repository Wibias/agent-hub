name: Reference Graph P2 verification

on:
  push:
    branches:
      - agent/reference-graph-p2

permissions:
  contents: read

concurrency:
  group: reference-graph-p2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Test Reference Graph P0-P2 contracts
        run: node --test tests/reference-graph/*.test.mjs

      - name: Measure current and snapshot control health
        run: |
          node reference-graph/cli/shadow-design-references.mjs \
            --offline \
            --control-date 2026-07-21 > /tmp/snapshot-lexical.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const value = JSON.parse(fs.readFileSync('/tmp/snapshot-lexical.json', 'utf8'));
          console.log(JSON.stringify({
            control_reference_time: value.control_reference_time,
            benchmark_control_health: value.control_health,
            current_control_health: value.current_control_health,
            lexical_summary: value.summary,
          }, null, 2));
          if (!value.control_health?.healthy) {
            throw new Error('snapshot control must be healthy');
          }
          if (value.current_control_health?.healthy) {
            throw new Error('current control was expected to expose the measured stale-catalog health problem');
          }
          NODE

      - name: Start Ollama
        run: |
          docker run -d --name reference-graph-ollama -p 11434:11434 ollama/ollama:latest
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:11434/api/version; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              docker logs reference-graph-ollama
              exit 1
            fi
            sleep 1
          done

      - name: Pull and verify pinned all-minilm model
        run: |
          curl -fsS http://127.0.0.1:11434/api/pull \
            -H 'content-type: application/json' \
            -d '{"model":"all-minilm:22m-l6-v2-fp16","stream":false}'
          node --input-type=module <<'NODE'
          import { OllamaEmbeddingProvider } from './reference-graph/ollama-embeddings.mjs';
          const provider = new OllamaEmbeddingProvider();
          const digest = await provider.verifyModel();
          const [embedding] = await provider.embed(['Reference Graph real-model smoke test']);
          console.log(JSON.stringify({
            model_id: provider.modelId,
            model_revision: provider.modelRevision,
            verified_digest: digest,
            dimensions: embedding.length,
          }, null, 2));
          NODE

      - name: Measure lexical, semantic, and hybrid against healthy snapshot control
        run: |
          node reference-graph/cli/shadow-design-references.mjs \
            --ollama-semantic \
            --control-date 2026-07-21 > /tmp/snapshot-semantic.json
          node reference-graph/cli/shadow-design-references.mjs \
            --ollama-hybrid \
            --control-date 2026-07-21 > /tmp/snapshot-hybrid.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const read = (path) => JSON.parse(fs.readFileSync(path, 'utf8'));
          const lexical = read('/tmp/snapshot-lexical.json');
          const semantic = read('/tmp/snapshot-semantic.json');
          const hybrid = read('/tmp/snapshot-hybrid.json');
          const pick = (value) => ({
            mode: value.mode,
            control_reference_time: value.control_reference_time,
            control_healthy: value.control_health?.healthy,
            semantic_enabled: value.semantic_enabled,
            model_id: value.model_id,
            model_revision: value.model_revision,
            summary: value.summary,
          });
          const delta = (candidate, baseline, field) => {
            const left = candidate.summary[field];
            const right = baseline.summary[field];
            return Number.isFinite(left) && Number.isFinite(right) ? left - right : null;
          };
          const evidence = {
            lexical: pick(lexical),
            semantic: pick(semantic),
            hybrid: pick(hybrid),
            semantic_vs_lexical: {
              average_overlap_delta: delta(semantic, lexical, 'average_overlap_at_k'),
              top1_retention_delta: delta(semantic, lexical, 'legacy_top1_retention_rate'),
            },
            hybrid_vs_lexical: {
              average_overlap_delta: delta(hybrid, lexical, 'average_overlap_at_k'),
              top1_retention_delta: delta(hybrid, lexical, 'legacy_top1_retention_rate'),
            },
          };
          evidence.semantic_vs_lexical.retrieval_progress =
            evidence.semantic_vs_lexical.average_overlap_delta > 0
            || evidence.semantic_vs_lexical.top1_retention_delta > 0;
          evidence.hybrid_vs_lexical.retrieval_progress =
            evidence.hybrid_vs_lexical.average_overlap_delta > 0
            || evidence.hybrid_vs_lexical.top1_retention_delta > 0;
          console.log(JSON.stringify(evidence, null, 2));
          NODE
