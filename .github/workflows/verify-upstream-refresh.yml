name: Verify upstream guidance refresh

on:
  push:
    branches:
      - agent/verify-skill-routing

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify portable skills
        run: node scripts/verify-portable-skills.mjs
      - name: Verify catalog routing
        run: node scripts/verify-skill-routing.mjs
      - name: Test catalog and runtime guidance
        run: node --test tests/skill-catalog/*.test.mjs tests/agent-runtime/*.test.mjs
      - name: Audit skill catalog
        run: node scripts/audit-skill-catalog.mjs
      - name: Validate changed skill structures
        run: |
          node skills/skill-ratchet/scripts/skill-ratchet.mjs validate --skill-root skills/skill-ratchet
          node skills/skill-ratchet/scripts/skill-ratchet.mjs validate --skill-root skills/context-engineering
          node skills/skill-ratchet/scripts/skill-ratchet.mjs validate --skill-root skills/grilling
          node skills/skill-ratchet/scripts/skill-ratchet.mjs validate --skill-root skills/performance
          node skills/skill-ratchet/scripts/skill-ratchet.mjs validate --skill-root skills/extract-approach
          node skills/skill-ratchet/scripts/skill-ratchet.mjs validate --skill-root skills/formal-verification
      - name: Verify generated index is current
        run: |
          node knowledge/build-index.mjs
          git diff --exit-code -- knowledge/INDEX.md knowledge/index.json
      - name: Verify generated routing index after refresh
        run: node scripts/verify-skill-routing.mjs --check-index
