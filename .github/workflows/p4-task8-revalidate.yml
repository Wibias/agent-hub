name: P4 Task 8 revalidation audit

on:
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Recreate and verify frozen population
        run: |
          node reference-graph/cli/plan-revalidation.mjs --now 2026-10-23 --wave-size 50 > p4-revalidation-plan.json
          actual="$(sha256sum p4-revalidation-plan.json | awk '{print $1}')"
          expected="48cde0c2962b6159c2ceb400dba6fb6a5e4e9d7e478517cea2991a0709e16939"
          echo "plan_sha256=$actual"
          test "$actual" = "$expected"
      - name: Audit current sources and committed analyses in frozen waves
        run: node .github/scripts/p4-revalidation-audit.mjs p4-revalidation-plan.json
      - name: Validate all terminal decisions through committed revalidation CLI
        run: |
          node knowledge/design-references/scripts/revalidate-batch.mjs --plan --review-log p4-review-log.jsonl > p4-revalidate-plan-result.json
          node - <<'NODE'
          const fs = require('node:fs');
          const result = JSON.parse(fs.readFileSync('p4-revalidate-plan-result.json', 'utf8'));
          if (result.summary.decision_count !== 598 || result.touched_ids.length !== 598) {
            throw new Error(`expected 598 validated decisions, got ${result.summary.decision_count}/${result.touched_ids.length}`);
          }
          console.log(JSON.stringify(result.summary, null, 2));
          NODE
      - name: Confirm untouched committed catalog remains production-valid
        run: node knowledge/design-references/scripts/validate.mjs --production
      - name: Secret-scan generated audit evidence
        run: |
          python3 skills/security-review-redirect/scripts/scan_secrets.py p4-review-log.jsonl
          python3 skills/security-review-redirect/scripts/scan_secrets.py p4-normalized-decisions.json
          python3 skills/security-review-redirect/scripts/scan_secrets.py p4-wave-evidence.json
          python3 skills/security-review-redirect/scripts/scan_secrets.py p4-audit-summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: p4-revalidation-audit
          path: |
            p4-revalidation-plan.json
            p4-review-log.jsonl
            p4-normalized-decisions.json
            p4-wave-evidence.json
            p4-audit-summary.json
            p4-revalidate-plan-result.json
          if-no-files-found: error
