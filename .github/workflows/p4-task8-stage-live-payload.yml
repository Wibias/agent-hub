name: P4 Task 8 stage live payload

on:
  pull_request:

permissions:
  contents: write
  actions: read

jobs:
  stage:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/reference-graph-p4'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/reference-graph-p4
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Download SHA-bound audit and import artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: p4-*
          path: .p4-artifacts
          merge-multiple: false
          github-token: ${{ github.token }}
          repository: Wibias/agent-hub
          run-id: '39901999569'
      - name: Download revalidated import artifact
        uses: actions/download-artifact@v4
        with:
          name: p4-live-import-payload
          path: .p4-import
          github-token: ${{ github.token }}
          repository: Wibias/agent-hub
          run-id: '39902752085'
      - name: Build minimal exact live payloads
        run: |
          mkdir -p reference-graph/evidence/.tmp-p4-live
          cp .p4-artifacts/p4-revalidation-audit/p4-normalized-decisions.json reference-graph/evidence/.tmp-p4-live/decisions.json
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const captures = JSON.parse(readFileSync('.p4-import/p4-import-captures.json', 'utf8'));
          const minimal = captures.map((capture) => ({
            source: capture.source,
            asset: capture.asset,
            chunks: capture.chunks,
            observations: [],
            tags: [],
            relations: [],
          }));
          if (minimal.length !== 600 || minimal.some((capture) => capture.chunks.length !== 1)) {
            throw new Error('expected 600 captures with exactly one chunk each');
          }
          writeFileSync('reference-graph/evidence/.tmp-p4-live/import.json', JSON.stringify(minimal));
          NODE
          sha256sum reference-graph/evidence/.tmp-p4-live/import.json | tee reference-graph/evidence/.tmp-p4-live/import.sha256
          sha256sum reference-graph/evidence/.tmp-p4-live/decisions.json | tee reference-graph/evidence/.tmp-p4-live/decisions.sha256
          python3 skills/security-review-redirect/scripts/scan_secrets.py reference-graph/evidence/.tmp-p4-live/import.json
          python3 skills/security-review-redirect/scripts/scan_secrets.py reference-graph/evidence/.tmp-p4-live/decisions.json
      - name: Commit temporary payloads
        run: |
          git add -f reference-graph/evidence/.tmp-p4-live
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: stage temporary P4 live payloads"
          git push origin HEAD:agent/reference-graph-p4
