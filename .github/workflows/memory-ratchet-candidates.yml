name: Memory ratchet candidates

on:
  pull_request:
    paths:
      - "tests/memory-ratchet/**"
      - ".github/workflows/memory-ratchet-candidates.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: memory-ratchet-candidates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agentmemory-full-smoke:
    name: agentmemory full-server smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build exact agentmemory revision
        env:
          AGENTMEMORY_REV: a76224f0987ed8f3ea0e4961f3928736ded23f54
        run: |
          git clone --quiet https://github.com/biencuong/agentmemory.git "$RUNNER_TEMP/agentmemory"
          git -C "$RUNNER_TEMP/agentmemory" checkout --quiet "$AGENTMEMORY_REV"
          test "$(git -C "$RUNNER_TEMP/agentmemory" rev-parse HEAD)" = "$AGENTMEMORY_REV"
          npm install --prefix "$RUNNER_TEMP/agentmemory" --no-audit --no-fund
          npm run build --prefix "$RUNNER_TEMP/agentmemory"
          test "$(node -p "require('$RUNNER_TEMP/agentmemory/package.json').version")" = "0.9.27"

      - name: Start full server and exercise project isolation
        shell: bash
        env:
          HOME: ${{ runner.temp }}/agentmemory-home
          CI: "true"
          III_REST_PORT: "3311"
          AGENTMEMORY_AUTO_COMPRESS: "false"
          AGENTMEMORY_INJECT_CONTEXT: "false"
          AGENTMEMORY_ALLOW_AGENT_SDK: "false"
          CONSOLIDATION_ENABLED: "false"
        run: |
          set -euo pipefail
          mkdir -p "$HOME" "$GITHUB_WORKSPACE/artifacts/memory-ratchet"
          cd "$RUNNER_TEMP/agentmemory"

          node dist/cli.mjs >"$RUNNER_TEMP/agentmemory.stdout" 2>"$RUNNER_TEMP/agentmemory.stderr" &
          CLI_PID=$!
          echo "$CLI_PID" > "$RUNNER_TEMP/agentmemory-cli.pid"

          ready=0
          for _ in $(seq 1 90); do
            if curl --silent --fail http://127.0.0.1:3311/agentmemory/livez >"$RUNNER_TEMP/livez.json"; then
              ready=1
              break
            fi
            if ! kill -0 "$CLI_PID" 2>/dev/null; then
              break
            fi
            sleep 1
          done

          {
            echo "ready=$ready"
            echo "--- livez ---"
            cat "$RUNNER_TEMP/livez.json" 2>/dev/null || true
            echo
            echo "--- stderr ---"
            cat "$RUNNER_TEMP/agentmemory.stderr" || true
            echo "--- stdout ---"
            cat "$RUNNER_TEMP/agentmemory.stdout" || true
          } > "$GITHUB_WORKSPACE/artifacts/memory-ratchet/agentmemory-full-smoke.txt"

          if [ "$ready" -ne 1 ]; then
            cat "$GITHUB_WORKSPACE/artifacts/memory-ratchet/agentmemory-full-smoke.txt"
            exit 1
          fi

          curl --silent --fail             -H 'content-type: application/json'             -d '{"content":"Project A uses Postgres.","type":"architecture","project":"mr-project-a"}'             http://127.0.0.1:3311/agentmemory/remember             >"$RUNNER_TEMP/remember.json"

          curl --silent --fail             -H 'content-type: application/json'             -d '{"query":"Postgres","project":"mr-project-a","limit":10,"format":"full"}'             http://127.0.0.1:3311/agentmemory/search             >"$RUNNER_TEMP/search-a.json"

          curl --silent --fail             -H 'content-type: application/json'             -d '{"query":"Postgres","project":"mr-project-b","limit":10,"format":"full"}'             http://127.0.0.1:3311/agentmemory/search             >"$RUNNER_TEMP/search-b.json"

          {
            echo
            echo "--- remember ---"
            cat "$RUNNER_TEMP/remember.json"
            echo
            echo "--- search project A ---"
            cat "$RUNNER_TEMP/search-a.json"
            echo
            echo "--- search project B ---"
            cat "$RUNNER_TEMP/search-b.json"
            echo
          } >> "$GITHUB_WORKSPACE/artifacts/memory-ratchet/agentmemory-full-smoke.txt"

          cat "$GITHUB_WORKSPACE/artifacts/memory-ratchet/agentmemory-full-smoke.txt"

      - name: Upload agentmemory smoke
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memory-ratchet-agentmemory-full-smoke
          path: ${{ github.workspace }}/artifacts/memory-ratchet/agentmemory-full-smoke.txt
          if-no-files-found: warn
          retention-days: 14
