name: Memory ratchet candidates

on:
  pull_request:
    paths:
      - "tests/memory-ratchet/**"
      - ".github/workflows/memory-ratchet-candidates.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: memory-ratchet-candidates-${{ github.ref }}
  cancel-in-progress: true

# Completed pinned candidate runs are recorded under tests/memory-ratchet/results/
# with their workflow run IDs and artifact digests. Keep this workflow focused
# on candidates that are still under evaluation; adapter regression tests run
# in Release governance on every relevant change.
jobs:
  open-candidates:
    name: open candidate placeholder
    runs-on: ubuntu-24.04
    steps:
      - run: echo "No unrecorded candidate job is configured on this commit."
