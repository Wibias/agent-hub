name: Memory ratchet candidates

on:
  pull_request:
    paths:
      - "tests/memory-ratchet/**"
      - ".github/workflows/memory-ratchet-candidates.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: memory-ratchet-candidates-${{ github.ref }}
  cancel-in-progress: true

# Completed pinned candidate runs are recorded under tests/memory-ratchet/results/
# with workflow run IDs and artifact digests. Only open candidates run here.
jobs:
  midas-core:
    name: Midas core hard gates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install exact Midas revision
        env:
          MIDAS_REV: ee9953c15a977343eb783de0b9f217aaf46e5b4e
        run: |
          git clone --quiet https://github.com/vornicx/Midas.git "$RUNNER_TEMP/midas"
          git -C "$RUNNER_TEMP/midas" checkout --quiet "$MIDAS_REV"
          test "$(git -C "$RUNNER_TEMP/midas" rev-parse HEAD)" = "$MIDAS_REV"
          python -m pip install --disable-pip-version-check -e "$RUNNER_TEMP/midas"
          python - <<'PY'
          import midas
          assert midas.__version__ == "1.0.0"
          PY

      - name: Run Midas M01-M12 core track
        env:
          MIDAS_PYTHON: python
        run: |
          mkdir -p artifacts/memory-ratchet
          node --input-type=module <<'NODE'
          import { writeFile } from 'node:fs/promises';
          import { createMidasAdapter } from './tests/memory-ratchet/adapters/midas.mjs';
          import { runCoreTrack } from './tests/memory-ratchet/core-track.mjs';

          const caseIds = Array.from(
            { length: 12 },
            (_, index) => `M${String(index + 1).padStart(2, '0')}`,
          );
          const report = await runCoreTrack({
            adapterFactory: () => createMidasAdapter(),
            caseIds,
          });

          await writeFile(
            'artifacts/memory-ratchet/midas-core.json',
            JSON.stringify(report, null, 2) + '\n',
            'utf8',
          );

          console.log(JSON.stringify(
            report.cases.map(({ case_id, status, secret_leaked, error }) => ({
              case_id,
              status,
              secret_leaked,
              error: error?.message ?? null,
            })),
            null,
            2,
          ));
          NODE

      - name: Upload Midas raw core report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memory-ratchet-midas-core
          path: artifacts/memory-ratchet/midas-core.json
          if-no-files-found: error
          retention-days: 14
