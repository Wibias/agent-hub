name: Memory ratchet candidates

on:
  pull_request:
    paths:
      - "tests/memory-ratchet/**"
      - ".github/workflows/memory-ratchet-candidates.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: memory-ratchet-candidates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hindsight-core:
    name: Hindsight core hard gates
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install exact Hindsight 0.10.1 source
        env:
          HINDSIGHT_REV: f8950b0c07d9e34c76493dba802bb309f0ce60fd
        run: |
          git clone --quiet https://github.com/vectorize-io/hindsight.git "$RUNNER_TEMP/hindsight"
          git -C "$RUNNER_TEMP/hindsight" checkout --quiet "$HINDSIGHT_REV"
          test "$(git -C "$RUNNER_TEMP/hindsight" rev-parse HEAD)" = "$HINDSIGHT_REV"
          python -m pip install --disable-pip-version-check             -e "$RUNNER_TEMP/hindsight/hindsight-api-slim[local-onnx,embedded-db]"
          python - <<'PY'
          from importlib.metadata import version
          assert version("hindsight-api-slim") == "0.10.1"
          PY

      - name: Download pinned ONNX embedding model
        env:
          MODEL_ID: intfloat/multilingual-e5-small
          MODEL_REV: fd1525a9fd15316a2d503bf26ab031a61d056e98
          MODEL_DIR: ${{ runner.temp }}/hindsight-e5-small
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import snapshot_download

          path = snapshot_download(
              repo_id=os.environ["MODEL_ID"],
              revision=os.environ["MODEL_REV"],
              local_dir=os.environ["MODEL_DIR"],
              allow_patterns=[
                  "onnx/model.onnx",
                  "config.json",
                  "tokenizer.json",
                  "tokenizer_config.json",
                  "special_tokens_map.json",
                  "sentencepiece.bpe.model",
              ],
          )
          print(path)
          PY
          test -f "$MODEL_DIR/onnx/model.onnx"
          test -f "$MODEL_DIR/tokenizer.json"

      - name: Run Hindsight M01-M12 core track
        env:
          HINDSIGHT_PYTHON: python
          HINDSIGHT_API_EMBEDDINGS_ONNX_MODEL_PATH: ${{ runner.temp }}/hindsight-e5-small/onnx/model.onnx
          HINDSIGHT_API_EMBEDDINGS_ONNX_TOKENIZER_NAME_OR_PATH: ${{ runner.temp }}/hindsight-e5-small
          HINDSIGHT_API_EMBEDDINGS_ONNX_DIMENSIONS: "384"
          HINDSIGHT_API_EMBEDDINGS_ONNX_QUERY_PREFIX: "query: "
          HINDSIGHT_API_EMBEDDINGS_ONNX_PASSAGE_PREFIX: "passage: "
        run: |
          mkdir -p artifacts/memory-ratchet
          node --input-type=module <<'NODE'
          import { writeFile } from 'node:fs/promises';
          import { createHindsightAdapter } from './tests/memory-ratchet/adapters/hindsight.mjs';
          import { runCoreTrack } from './tests/memory-ratchet/core-track.mjs';

          const caseIds = Array.from(
            { length: 12 },
            (_, index) => `M${String(index + 1).padStart(2, '0')}`,
          );
          const report = await runCoreTrack({
            adapterFactory: () => createHindsightAdapter(),
            caseIds,
          });

          await writeFile(
            'artifacts/memory-ratchet/hindsight-core.json',
            JSON.stringify(report, null, 2) + '\n',
            'utf8',
          );

          console.log(JSON.stringify(
            report.cases.map(({ case_id, status, secret_leaked, error }) => ({
              case_id,
              status,
              secret_leaked,
              error: error?.message ?? null,
            })),
            null,
            2,
          ));
          NODE

      - name: Preserve Hindsight server logs
        if: always()
        run: |
          mkdir -p artifacts/memory-ratchet
          cp "$RUNNER_TEMP/memory-ratchet-hindsight.stdout.log" artifacts/memory-ratchet/ 2>/dev/null || true
          cp "$RUNNER_TEMP/memory-ratchet-hindsight.stderr.log" artifacts/memory-ratchet/ 2>/dev/null || true

      - name: Upload Hindsight raw core report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memory-ratchet-hindsight-core
          path: |
            artifacts/memory-ratchet/hindsight-core.json
            artifacts/memory-ratchet/memory-ratchet-hindsight.stdout.log
            artifacts/memory-ratchet/memory-ratchet-hindsight.stderr.log
          if-no-files-found: error
          retention-days: 14
