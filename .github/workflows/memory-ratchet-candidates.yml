name: Memory ratchet candidates

on:
  pull_request:
    paths:
      - "tests/memory-ratchet/**"
      - ".github/workflows/memory-ratchet-candidates.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: memory-ratchet-candidates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  memspec-core:
    name: memspec core hard gates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build exact memspec revision
        env:
          MEMSPEC_REV: 7c0a47f36d75585db0701b9828592433a0fa1c7b
        run: |
          git clone --quiet https://github.com/siimvene/memspec.git "$RUNNER_TEMP/memspec"
          git -C "$RUNNER_TEMP/memspec" checkout --quiet "$MEMSPEC_REV"
          test "$(git -C "$RUNNER_TEMP/memspec" rev-parse HEAD)" = "$MEMSPEC_REV"
          npm ci --prefix "$RUNNER_TEMP/memspec"
          npm run build --prefix "$RUNNER_TEMP/memspec"
          (cd "$RUNNER_TEMP/memspec" && npm link)

      - name: Run memspec M01-M12 core track
        run: |
          mkdir -p artifacts/memory-ratchet
          node --input-type=module <<'NODE'
          import { writeFile } from 'node:fs/promises';
          import { createMemspecAdapter } from './tests/memory-ratchet/adapters/memspec.mjs';
          import { runCoreTrack } from './tests/memory-ratchet/core-track.mjs';

          const caseIds = Array.from(
            { length: 12 },
            (_, index) => `M${String(index + 1).padStart(2, '0')}`,
          );
          const report = await runCoreTrack({
            adapterFactory: () => createMemspecAdapter(),
            caseIds,
          });

          await writeFile(
            'artifacts/memory-ratchet/memspec-core.json',
            JSON.stringify(report, null, 2) + '\n',
            'utf8',
          );

          console.log(JSON.stringify(
            report.cases.map(({ case_id, status, secret_leaked, error }) => ({
              case_id,
              status,
              secret_leaked,
              error: error?.message ?? null,
            })),
            null,
            2,
          ));
          NODE

      - name: Upload memspec raw core report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memory-ratchet-memspec-core
          path: artifacts/memory-ratchet/memspec-core.json
          if-no-files-found: error
          retention-days: 14


  memspec-runtime-smoke:
    name: memspec runtime smoke (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [20, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Build exact memspec revision
        env:
          MEMSPEC_REV: 7c0a47f36d75585db0701b9828592433a0fa1c7b
        run: |
          git clone --quiet https://github.com/siimvene/memspec.git "$RUNNER_TEMP/memspec"
          git -C "$RUNNER_TEMP/memspec" checkout --quiet "$MEMSPEC_REV"
          test "$(git -C "$RUNNER_TEMP/memspec" rev-parse HEAD)" = "$MEMSPEC_REV"
          npm ci --prefix "$RUNNER_TEMP/memspec"
          npm run build --prefix "$RUNNER_TEMP/memspec"
          (cd "$RUNNER_TEMP/memspec" && npm link)

      - name: Run init remember search smoke
        shell: bash
        run: |
          ROOT="$RUNNER_TEMP/memspec-smoke"
          mkdir -p "$ROOT"
          git init --quiet --initial-branch=main "$ROOT"
          git -C "$ROOT" config user.name "Memory Ratchet"
          git -C "$ROOT" config user.email "memory-ratchet@example.invalid"
          printf 'export const value = 1;\n' > "$ROOT/example.ts"
          git -C "$ROOT" add .
          git -C "$ROOT" commit --quiet -m bootstrap

          memspec init --cwd "$ROOT" --no-interactive --skip-import --skip-patch --no-install-hooks

          set +e
          memspec remember fact "Smoke fact" --cwd "$ROOT" --body "Smoke fact body." --source agent:smoke >"$RUNNER_TEMP/remember.stdout" 2>"$RUNNER_TEMP/remember.stderr"
          REMEMBER_STATUS=$?
          if [ "$REMEMBER_STATUS" -eq 0 ]; then
            memspec search "Smoke fact" --cwd "$ROOT" --json --full >"$RUNNER_TEMP/search.stdout" 2>"$RUNNER_TEMP/search.stderr"
            SEARCH_STATUS=$?
          else
            SEARCH_STATUS=125
            : >"$RUNNER_TEMP/search.stdout"
            : >"$RUNNER_TEMP/search.stderr"
          fi
          set -e

          {
            printf 'node=%s\n' "$(node --version)"
            printf 'remember_status=%s\n' "$REMEMBER_STATUS"
            printf 'search_status=%s\n' "$SEARCH_STATUS"
            printf '%s\n' '--- remember stderr ---'
            cat "$RUNNER_TEMP/remember.stderr"
            printf '%s\n' '--- remember stdout ---'
            cat "$RUNNER_TEMP/remember.stdout"
            printf '%s\n' '--- search stderr ---'
            cat "$RUNNER_TEMP/search.stderr"
            printf '%s\n' '--- search stdout ---'
            cat "$RUNNER_TEMP/search.stdout"
          } | tee "$RUNNER_TEMP/memspec-runtime-smoke.txt"

      - name: Upload runtime smoke
        uses: actions/upload-artifact@v4
        with:
          name: memspec-runtime-smoke-node-${{ matrix.node }}
          path: ${{ runner.temp }}/memspec-runtime-smoke.txt
          retention-days: 14


  kage-core:
    name: Kage core hard gates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build exact Kage revision
        env:
          KAGE_REV: e7cc087666fd3d01a5727f8a67e7b9e745fca904
        run: |
          git clone --quiet https://github.com/kage-core/Kage.git "$RUNNER_TEMP/kage"
          git -C "$RUNNER_TEMP/kage" checkout --quiet "$KAGE_REV"
          test "$(git -C "$RUNNER_TEMP/kage" rev-parse HEAD)" = "$KAGE_REV"
          npm ci --prefix "$RUNNER_TEMP/kage/mcp"
          npm run build --prefix "$RUNNER_TEMP/kage/mcp"
          (cd "$RUNNER_TEMP/kage/mcp" && npm link)
          command -v kage >/dev/null

      - name: Run Kage M01-M12 core track
        run: |
          mkdir -p artifacts/memory-ratchet
          node --input-type=module <<'NODE'
          import { writeFile } from 'node:fs/promises';
          import { createKageAdapter } from './tests/memory-ratchet/adapters/kage.mjs';
          import { runCoreTrack } from './tests/memory-ratchet/core-track.mjs';

          const caseIds = Array.from(
            { length: 12 },
            (_, index) => `M${String(index + 1).padStart(2, '0')}`,
          );
          const report = await runCoreTrack({
            adapterFactory: () => createKageAdapter(),
            caseIds,
          });

          await writeFile(
            'artifacts/memory-ratchet/kage-core.json',
            JSON.stringify(report, null, 2) + '\n',
            'utf8',
          );

          console.log(JSON.stringify(
            report.cases.map(({ case_id, status, secret_leaked, error }) => ({
              case_id,
              status,
              secret_leaked,
              error: error?.message ?? null,
            })),
            null,
            2,
          ));
          NODE

      - name: Upload Kage raw core report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memory-ratchet-kage-core
          path: artifacts/memory-ratchet/kage-core.json
          if-no-files-found: error
          retention-days: 14
