name: Memory ratchet candidates

on:
  pull_request:
    paths:
      - "tests/memory-ratchet/**"
      - ".github/workflows/memory-ratchet-candidates.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: memory-ratchet-candidates-${{ github.ref }}
  cancel-in-progress: true

# Completed pinned candidate runs are recorded under tests/memory-ratchet/results/
# with their run IDs and artifact digests. Only open candidates run here.
jobs:
  open-candidates:
    name: open candidate placeholder
    runs-on: ubuntu-24.04
    steps:
      - run: echo "Hindsight is the only remaining candidate; its job is added after adapter validation."
