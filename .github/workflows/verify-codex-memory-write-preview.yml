name: Codex approved Memory Write preview (real stdio SQLite)

on:
  push:
    branches:
      - feat/codex-memory-write-approved-preview-20261112
    paths:
      - 'memory-engine/adapters/codex-approved-memory-write*'
      - 'scripts/*codex-approved-memory-write*'
      - 'tests/memory-engine/codex-approved-memory-write-mcp.test.mjs'
      - '.github/workflows/verify-codex-memory-write-preview.yml'
  pull_request:
    paths:
      - 'memory-engine/adapters/codex-approved-memory-write*'
      - 'scripts/*codex-approved-memory-write*'
      - 'tests/memory-engine/codex-approved-memory-write-mcp.test.mjs'
      - '.github/workflows/verify-codex-memory-write-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actual-memory-write-stdio:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Real stdio tools/call, one-use approval and canonical readback
        run: node --test tests/memory-engine/codex-approved-memory-write-mcp.test.mjs tests/memory-engine/codex-memory-commit-cli.test.mjs
