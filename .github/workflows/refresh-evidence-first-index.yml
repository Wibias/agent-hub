name: Refresh evidence-first knowledge index

on:
  push:
    branches:
      - feat/evidence-first-git-prose

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Regenerate knowledge index
        run: node knowledge/build-index.mjs

      - name: Verify generated scope
        run: |
          git diff --name-only -- knowledge/INDEX.md knowledge/index.json
          unexpected="$(git diff --name-only | grep -vE '^(knowledge/INDEX\.md|knowledge/index\.json)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected generated changes:"
            echo "$unexpected"
            exit 1
          fi

      - name: Commit generated outputs and self-clean
        run: |
          rm .github/workflows/refresh-evidence-first-index.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add knowledge/INDEX.md knowledge/index.json .github/workflows/refresh-evidence-first-index.yml
          git commit -m "Refresh knowledge index after prose guidance change"
          git push origin HEAD:feat/evidence-first-git-prose
