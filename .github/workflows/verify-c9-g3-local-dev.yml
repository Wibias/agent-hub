name: C9 G3 local development integration (review only)
on:
  push:
    branches: [codex/c9-g3-offline-review]
    paths:
      - 'experiments/c9/g3-local-dev/**'
      - '.github/workflows/verify-c9-g3-local-dev.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-dev:
    runs-on: windows-2022
    timeout-minutes: 10
    defaults:
      run:
        working-directory: experiments/c9/g3-local-dev
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.100'
      - name: Test persistent local dev integration only
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((dotnet --version).Trim() -cne '10.0.100') { throw 'Unexpected SDK' }
          dotnet run --project tests/AgentHub.C9.G3.LocalDev.Tests.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { throw "G3 local dev integration failed: $LASTEXITCODE" }
          Write-Host "C9_G3_LOCAL_DEV_REVIEW_PASS SHA=$env:GITHUB_SHA SDK=10.0.100"
          Write-Host 'NO_WORM NO_SERVICES NO_SCM G3_HOLD PRODUCTION_NO_GO'
