name: P11 live activation canary

on:
  push:
    branches:
      - agent/reference-graph-p11
    paths:
      - .github/workflows/p11-live-activation-canary.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run controlled P11 quick activation canary
        env:
          SUPABASE_URL: https://vrznfnxzlxaavpqbzbzd.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_rdBBU9vE1K0jlxWIOoqevQ_Yg9x1BdG
          REFERENCE_DATE: '2026-10-23'
        run: node reference-graph/p11-live-activation-canary.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: p11-live-activation-canary
          path: /tmp/p11-live-activation-canary.json
          if-no-files-found: error
