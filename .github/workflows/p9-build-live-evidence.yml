name: P9 build live evidence

on:
  push:
    branches:
      - agent/reference-graph-p9
    paths:
      - .github/workflows/p9-build-live-evidence.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/reference-graph-p9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build canonical secret-free P9 receipt
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {
            assertSecretFreeP9Receipt,
            createP9Receipt,
            finalizeP9Receipt,
            recordP9Phase,
          } from './reference-graph/p9-receipt.mjs';

          const implementationSha = 'a5458ee322e459aea114d242d243ded9e027c4d4';
          const binding = {
            purpose: 'agent-hub-reference-graph',
            project_ref: 'vrznfnxzlxaavpqbzbzd',
            project_name: 'agent-hub-reference-graph',
            region: 'eu-central-1',
          };

          let receipt = createP9Receipt({
            binding,
            baseSha: '619e0b490420f5292dd4bf16ae36cded4013f7d5',
            gitSha: implementationSha,
            verificationAt: new Date().toISOString(),
            referenceTime: '2026-10-23T12:00:00.000Z',
          });

          receipt = recordP9Phase(receipt, {
            phase: 'preflight',
            status: 'success',
            detail: {
              target_status: 'ACTIVE_HEALTHY',
              reference_graph_governance_run: 40030040675,
              runtime_behavior_sha: '94522a8b91cc627dccb6087e5dc4eb8212758788',
              receipt_hardening_only_since_runtime: true,
              production_query_blob: '4963cfbaf4306a03084f4513a1e324f649ce36e5',
            },
          });
          receipt = recordP9Phase(receipt, {
            phase: 'migration',
            status: 'success',
            detail: {
              migration_file: '008_reference_graph_runtime_canary.sql',
              live_migration_version: '20261023214135',
              live_migration_name: 'reference_graph_runtime_canary_p9',
              wrapper_exists: true,
              security_advisor_p9_warn_error_count: 2,
              security_advisor_findings: [
                'anon_security_definer_function_executable',
                'authenticated_security_definer_function_executable',
              ],
            },
          });
          receipt = recordP9Phase(receipt, {
            phase: 'transport',
            status: 'success',
            detail: {
              status: 'available',
              auth_mode: 'publishable',
              live_http_transport_verified: true,
              candidate_count: 275,
              probe_run_id: 40029153877,
              artifact_digest: 'sha256:6d0a6ddabce7482cfa81ed0f7e1e6ef026dc7c2b86dbfa99dfe866f1c219460c',
              privileged_runtime_credential_used: false,
            },
          });
          receipt = recordP9Phase(receipt, {
            phase: 'canary',
            status: 'success',
            detail: {
              case_count: 24,
              exact_record_count: 24,
              exact_pattern_count: 24,
              mismatch_count: 0,
              legacy_authoritative_count: 24,
            },
          });

          receipt = finalizeP9Receipt(receipt, {
            migration: {
              status: 'verified',
              migration: '008_reference_graph_runtime_canary.sql',
              runtime_rpc: 'reference_graph_quick_candidate_pool_runtime_p9',
              zero_argument: true,
              current_date_only: true,
            },
            runtimeSecurity: {
              anon_wrapper_execute: true,
              authenticated_wrapper_execute: true,
              p7_denied: true,
              p6_denied: true,
              write_denied: true,
              direct_table_select_denied: true,
              service_role_used_by_canary: false,
              security_advisor_p9_warn_error_count: 2,
            },
            candidatePool: {
              status: 'available',
              candidate_count: 275,
              complete_metadata_count: 275,
              unique_legacy_id_count: 275,
              live_hash: 'd489261eb810d8e27ed32bc774cf173f',
              offline_hash: 'd489261eb810d8e27ed32bc774cf173f',
              equivalent: true,
            },
            transport: {
              status: 'available',
              live_http_transport_verified: true,
              auth_mode: 'publishable',
              candidate_count: 275,
              run_id: 40029153877,
              artifact_digest: 'sha256:6d0a6ddabce7482cfa81ed0f7e1e6ef026dc7c2b86dbfa99dfe866f1c219460c',
            },
            canary: {
              status: 'available',
              case_count: 24,
              exact_record_count: 24,
              exact_pattern_count: 24,
              mismatch_count: 0,
              legacy_authoritative_count: 24,
            },
            fallbackVerification: {
              transport_failure_fallback: true,
              malformed_payload_fallback: true,
              standard_no_network: true,
              deep_no_network: true,
              usage_legacy_only: true,
            },
            blockers: [
              'Supabase security advisor reports 2 P9-attributable WARN findings for the intentionally runtime-executable SECURITY DEFINER wrapper',
            ],
          });

          assertSecretFreeP9Receipt(receipt);
          if (receipt.least_privilege_transport_ready !== false
            || receipt.quick_shadow_canary_ready !== false
            || receipt.production_activation_ready !== false
            || receipt.production_source !== 'legacy-control'
            || receipt.activation_performed !== false) {
            throw new Error(`unexpected final P9 receipt decision: ${JSON.stringify(receipt)}`);
          }

          fs.writeFileSync('/tmp/p9-runtime-canary-evidence.json', JSON.stringify(receipt, null, 2) + '\n');
          console.log(JSON.stringify({
            schema_version: receipt.schema_version,
            git_sha: receipt.git_sha,
            least_privilege_transport_ready: receipt.least_privilege_transport_ready,
            quick_shadow_canary_ready: receipt.quick_shadow_canary_ready,
            production_activation_ready: receipt.production_activation_ready,
            production_source: receipt.production_source,
            blocker_count: receipt.blockers.length,
            blockers: receipt.blockers,
          }, null, 2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: p9-runtime-canary-evidence
          path: /tmp/p9-runtime-canary-evidence.json
          if-no-files-found: error
