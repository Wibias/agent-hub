name: P4 Task 8 stage exact embeddings

on:
  pull_request:

permissions:
  contents: write
  actions: read

jobs:
  stage:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/reference-graph-p4'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/reference-graph-p4
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Exit when exact staged artifact is already present
        id: existing
        run: |
          if [ -f reference-graph/evidence/.tmp-p4-embeddings/embeddings.json ]; then
            actual="$(sha256sum reference-graph/evidence/.tmp-p4-embeddings/embeddings.json | awk '{print $1}')"
            if [ "$actual" = "ac701b2455f8ec54c29c605abea92eb2d8950bccfdc84c27b211e2b0717970ee" ]; then
              echo "present=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "unexpected staged embedding payload sha: $actual" >&2
            exit 1
          fi
          echo "present=false" >> "$GITHUB_OUTPUT"
      - name: Download exact Snowflake artifact
        if: steps.existing.outputs.present != 'true'
        uses: actions/download-artifact@v4
        with:
          name: p4-exact-snowflake-embeddings
          path: .p4-embeddings
          github-token: ${{ github.token }}
          repository: Wibias/agent-hub
          run-id: '39904169297'
      - name: Verify and stage exact export
        if: steps.existing.outputs.present != 'true'
        run: |
          test "$(sha256sum .p4-embeddings/p4-embedding-export.json | awk '{print $1}')" = "ac701b2455f8ec54c29c605abea92eb2d8950bccfdc84c27b211e2b0717970ee"
          node - <<'NODE'
          const fs = require('node:fs');
          const artifact = JSON.parse(fs.readFileSync('.p4-embeddings/p4-embedding-export.json', 'utf8'));
          if (artifact.summary?.row_count !== 600 || artifact.summary?.text_hash_count !== 600 || artifact.rows?.length !== 600) throw new Error('embedding row count mismatch');
          if (artifact.profile?.model_id !== 'ollama/snowflake-arctic-embed:33m' || artifact.profile?.model_revision !== 'e8db018629b4' || artifact.profile?.dimensions !== 384) throw new Error('embedding profile mismatch');
          NODE
          python3 skills/security-review-redirect/scripts/scan_secrets.py .p4-embeddings/p4-embedding-export.json
          mkdir -p reference-graph/evidence/.tmp-p4-embeddings
          cp .p4-embeddings/p4-embedding-export.json reference-graph/evidence/.tmp-p4-embeddings/embeddings.json
          cp .p4-embeddings/p4-embedding-export.sha256 reference-graph/evidence/.tmp-p4-embeddings/embeddings.sha256
          cp .p4-embeddings/p4-ollama-tags.json reference-graph/evidence/.tmp-p4-embeddings/ollama-tags.json
      - name: Commit temporary exact embedding payload
        if: steps.existing.outputs.present != 'true'
        run: |
          git add -f reference-graph/evidence/.tmp-p4-embeddings
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: stage temporary P4 embeddings"
          git push origin HEAD:agent/reference-graph-p4
