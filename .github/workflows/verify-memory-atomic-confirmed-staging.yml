name: Memory Atomic Confirmed Staging D12.3

on:
  pull_request:
    paths:
      - "memory-engine/memory-atomic-confirmed-staging.mjs"
      - "tests/memory-engine/memory-atomic-confirmed-staging.test.mjs"
      - "docs/memory-d12-3-confirmed-staging.md"
      - ".github/workflows/verify-memory-atomic-confirmed-staging.yml"
  push:
    branches: [main]
    paths:
      - "memory-engine/memory-atomic-confirmed-staging.mjs"
      - "tests/memory-engine/memory-atomic-confirmed-staging.test.mjs"
      - "docs/memory-d12-3-confirmed-staging.md"
      - ".github/workflows/verify-memory-atomic-confirmed-staging.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Verify opt-in atomic staging against disposable canonical MemoryEngine
        run: |
          node --check memory-engine/memory-atomic-confirmed-staging.mjs
          node --test tests/memory-engine/memory-atomic-confirmed-staging.test.mjs
