name: Temporary Impeccable upstream sync

on:
  push:
    branches:
      - chore/sync-upstreams-2026-10-13

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/sync-upstreams-2026-10-13
          fetch-depth: 0

      - name: Sync pinned upstream files
        shell: bash
        run: |
          set -euo pipefail
          upstream=245ad82def45831dc56a21b683c7a1ff530b06cc
          base="https://raw.githubusercontent.com/pbakaus/impeccable/${upstream}/.agents/skills/impeccable"
          curl --fail --silent --show-error --location "${base}/reference/new-work.md" -o skills/impeccable/reference/new-work.md
          curl --fail --silent --show-error --location "${base}/scripts/live-browser.js" -o skills/impeccable/scripts/live-browser.js
          rm .github/workflows/temp-sync-impeccable-upstream.yml

      - name: Commit exact vendor sync
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add skills/impeccable/reference/new-work.md skills/impeccable/scripts/live-browser.js .github/workflows/temp-sync-impeccable-upstream.yml
          git diff --cached --quiet && exit 0
          git commit -m "chore(impeccable): sync large upstream files 4.5.2"
          git push origin HEAD:chore/sync-upstreams-2026-10-13
