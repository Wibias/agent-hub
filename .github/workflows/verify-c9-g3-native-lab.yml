name: C9 G3 native HKLM disposable runner lab
on:
  push:
    branches: [codex/c9-g3-offline-review]
    paths:
      - 'experiments/c9/g3-native-lab/**'
      - '.github/workflows/verify-c9-g3-native-lab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ephemeral-registry-lab:
    runs-on: windows-2022
    timeout-minutes: 12
    defaults:
      run:
        working-directory: experiments/c9/g3-native-lab
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.100'
      - name: Exact SDK and disposable native HKLM lab only
        shell: pwsh
        env:
          AGENTHUB_C9_G3_HKLM_LAB: DISPOSABLE_RUNNER_ONLY
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or $env:RUNNER_OS -cne 'Windows') { throw 'C9 deny non-hosted Windows' }
          $sdk = (dotnet --version).Trim()
          if ($sdk -cne '10.0.100') { throw "Unexpected SDK: $sdk" }
          dotnet run --project tests/AgentHub.C9.G3.NativeLab.Tests.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { throw "Native lab failed: $LASTEXITCODE" }
          Write-Host "C9_G3_NATIVE_HKLM_REVIEW_PASS SHA=$env:GITHUB_SHA SDK=$sdk"
          Write-Host 'DISPOSABLE_RUNNER_ONLY NO_PRODUCTION_KEYS NO_SCM G3_HOLD PRODUCTION_NO_GO'
