name: Upstream authoring skill structural verification

on:
  pull_request:
    paths:
      - 'skills/design-with-ai/**'
      - 'skills/github-delivery/**'
      - 'knowledge/**'
      - 'upstream-sources.json'
      - 'scripts/check-upstream-sources.mjs'
      - 'scripts/lib/upstream-status.mjs'
      - 'tests/skill-catalog/upstream-*.test.mjs'
      - '.github/workflows/verify-upstream-authoring-skills.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Ensure standalone Impeccable is no longer discoverable
        run: |
          test ! -e skills/impeccable/SKILL.md
          test ! -e skills/design-with-ai/internal/impeccable/SKILL.md
      - name: Validate upstream source ownership and pending-review behavior
        run: node --test tests/skill-catalog/upstream-status.test.mjs tests/skill-catalog/upstream-update-check.test.mjs
      - name: Validate Design with AI skill
        run: node scripts/skill-ratchet.mjs validate --skill-root "$PWD/skills/design-with-ai" --json
      - name: Test integrated Impeccable ownership and provider routing
        run: node --test skills/design-with-ai/tests/impeccable-unified-routes.test.mjs

      - name: Test opt-in Impeccable hook migration
        run: node --test skills/design-with-ai/tests/impeccable-hook-migration.test.mjs

      - name: Test internal Impeccable Live loopback server
        run: node --test skills/design-with-ai/tests/impeccable-live-smoke.test.mjs

      - name: Test selective DWA upstream adaptations
        run: node --test skills/design-with-ai/tests/impeccable-v410-selective-review.test.mjs
      - name: Validate GitHub Delivery skill
        run: node scripts/skill-ratchet.mjs validate --skill-root "$PWD/skills/github-delivery" --json
      - name: Verify knowledge index
        run: |
          node knowledge/build-index.mjs
          git diff --exit-code -- knowledge/index.json knowledge/INDEX.md
