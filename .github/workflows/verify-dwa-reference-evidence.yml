name: DWA reference evidence verification

on:
  pull_request:
    paths:
      - 'skills/design-with-ai/scripts/reference-capture-check.mjs'
      - 'skills/design-with-ai/scripts/reference-originality.mjs'
      - 'skills/design-with-ai/tests/reference-evidence.test.mjs'
      - 'skills/design-with-ai/tests/reference-capture-browser-smoke.mjs'
      - 'skills/design-with-ai/tests/evals/**'
      - 'skills/design-with-ai/references/settled-reference-capture.md'
      - 'skills/design-with-ai/references/reference-originality-review.md'
      - 'skills/design-with-ai/references/source-evidence.md'
      - 'skills/design-with-ai/UPSTREAM.md'
      - '.github/workflows/verify-dwa-reference-evidence.yml'
  push:
    branches:
      - main
    paths:
      - 'skills/design-with-ai/scripts/reference-capture-check.mjs'
      - 'skills/design-with-ai/scripts/reference-originality.mjs'
      - 'skills/design-with-ai/tests/reference-evidence.test.mjs'
      - 'skills/design-with-ai/tests/reference-capture-browser-smoke.mjs'
      - 'skills/design-with-ai/tests/evals/**'
      - 'skills/design-with-ai/references/settled-reference-capture.md'
      - 'skills/design-with-ai/references/reference-originality-review.md'
      - 'skills/design-with-ai/references/source-evidence.md'
      - 'skills/design-with-ai/UPSTREAM.md'
      - '.github/workflows/verify-dwa-reference-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
      - name: Parse both local evidence tools
        run: |
          node --check skills/design-with-ai/scripts/reference-capture-check.mjs
          node --check skills/design-with-ai/scripts/reference-originality.mjs
      - name: Verify manifest coverage and originality boundaries
        run: node --test skills/design-with-ai/tests/reference-evidence.test.mjs
      - name: Structural Skill Ratchet validation (not the two-model qualification)
        run: node skills/skill-ratchet/scripts/skill-ratchet.mjs validate --skill-root skills/design-with-ai --json

  browser-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Resolve preinstalled Chrome
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME"
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
      - name: Install pinned test-only Playwright transport
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/dwa-reference-playwright" --no-save --no-audit --no-fund --ignore-scripts --package-lock=false playwright-core@1.64.1
          node -e "const p=require(process.env.RUNNER_TEMP+'/dwa-reference-playwright/node_modules/playwright-core/package.json'); if(p.version !== '1.64.1') process.exit(1)"
          echo "DWA_PLAYWRIGHT_ROOT=$RUNNER_TEMP/dwa-reference-playwright/node_modules/playwright-core" >> "$GITHUB_ENV"
      - name: Capture actual Chrome viewports after lazy-load and reject gaps
        run: node skills/design-with-ai/tests/reference-capture-browser-smoke.mjs
