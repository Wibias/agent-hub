name: Memory Evidence-Bound unapproved intent visibility and hook interception

on:
  pull_request:
    paths:
      - 'memory-engine/evidence-bound-review-readonly.mjs'
      - 'memory-engine/adapters/codex-hooks-core.mjs'
      - 'memory-ui/app.js'
      - 'tests/memory-engine/memory-console-evidence-review.test.mjs'
      - 'tests/memory-engine/codex-memory-command-failclosed.test.mjs'
      - '.github/workflows/verify-memory-evidence-intent-visibility.yml'
  push:
    branches: [main]
    paths:
      - 'memory-engine/evidence-bound-review-readonly.mjs'
      - 'memory-engine/adapters/codex-hooks-core.mjs'
      - 'memory-ui/app.js'
      - 'tests/memory-engine/memory-console-evidence-review.test.mjs'
      - 'tests/memory-engine/codex-memory-command-failclosed.test.mjs'
      - '.github/workflows/verify-memory-evidence-intent-visibility.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Check UI script and hook parser
        run: >-
          node --check memory-ui/app.js
      - name: Verify intent display and real Codex command blocking
        run: >-
          node --test
          tests/memory-engine/memory-console-evidence-review.test.mjs
          tests/memory-engine/codex-memory-command-failclosed.test.mjs
          tests/memory-engine/memory-console-d12-1-readable.test.mjs
