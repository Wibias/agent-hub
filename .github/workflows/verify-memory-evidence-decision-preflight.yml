name: Memory Evidence-Bound decision read-only preflight
on:
  pull_request:
    paths:
      - 'memory-engine/evidence-bound-decision-preflight.mjs'
      - 'scripts/inspect-evidence-bound-decision.mjs'
      - 'tests/memory-engine/evidence-bound-decision-preflight.test.mjs'
      - 'docs/memory-evidence-bound-decision-preflight.md'
      - '.github/workflows/verify-memory-evidence-decision-preflight.yml'
  push:
    branches: [main]
    paths:
      - 'memory-engine/evidence-bound-decision-preflight.mjs'
      - 'scripts/inspect-evidence-bound-decision.mjs'
      - 'tests/memory-engine/evidence-bound-decision-preflight.test.mjs'
      - '.github/workflows/verify-memory-evidence-decision-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Validate nonmutating proposal review, strict scope and existing stores
        run: >-
          node --test
          tests/memory-engine/evidence-bound-decision-preflight.test.mjs
          tests/memory-engine/evidence-bound-proposal-store.test.mjs
          tests/memory-engine/memory-local-proposal-evidence-review.test.mjs
