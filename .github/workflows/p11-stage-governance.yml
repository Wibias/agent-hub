name: P11 stage governance patch

on:
  push:
    branches:
      - agent/reference-graph-p11
    paths:
      - .github/workflows/p11-stage-governance.yml

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/reference-graph-p11
          fetch-depth: 0
      - name: Stage patched governance and README as ordinary files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('reference-graph/p11-stage-governance.py')
          text = p.read_text()
          old = "p10-runtime-projection-evidence\\\\.json"
          new = "p10-runtime-projection-evidence\\.json"
          if text.count(old) != 1:
              raise SystemExit(f'expected one over-escaped P10 regex anchor, got {text.count(old)}')
          p.write_text(text.replace(old, new))
          PY
          python3 reference-graph/p11-stage-governance.py
          git config user.name "Wibias"
          git config user.email "37517432+Wibias@users.noreply.github.com"
          git add reference-graph/.p11-governance.yml reference-graph/.p11-readme.md
          git commit -m "chore: stage P11 governance and README patch"
          git push origin HEAD:agent/reference-graph-p11
