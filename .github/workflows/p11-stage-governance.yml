name: P11 stage governance patch

on:
  push:
    branches:
      - agent/reference-graph-p11
    paths:
      - .github/workflows/p11-stage-governance.yml

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/reference-graph-p11
          fetch-depth: 0
      - name: Stage patched governance and README as ordinary files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          workflow_path = Path('.github/workflows/verify-reference-graph.yml')
          workflow = workflow_path.read_text()

          old_import = "          import { assertSecretFreeP10Receipt } from './reference-graph/p10-receipt.mjs';\n"
          new_import = old_import + "          import { assertSecretFreeP11Receipt } from './reference-graph/p11-receipt.mjs';\n"
          if workflow.count(old_import) != 1:
              raise SystemExit(f'expected one P10 receipt import, got {workflow.count(old_import)}')
          workflow = workflow.replace(old_import, new_import)

          p10_loop = re.compile(
              r"(          for \(const file of \[\n"
              r"            'reference-graph/evidence/p10-runtime-projection-evidence\\.json',\n"
              r"          \]\) \{.*?          \}\n)\n          NODE",
              re.S,
          )
          p11_loop = """\1
          for (const file of [
            'reference-graph/evidence/p11-quick-activation-evidence.json',
          ]) {
            if (!existsSync(file)) continue;
            const value = JSON.parse(readFileSync(file, 'utf8'));
            assertSecretFreeP11Receipt(value);
            console.log(`secret-free: ${file}`);
          }

          NODE"""
          workflow, count = p10_loop.subn(p11_loop, workflow, count=1)
          if count != 1:
              raise SystemExit(f'expected one P10 evidence loop anchor, got {count}')

          p8_legacy_step = re.compile(
              r"\n      - name: Verify P8 production CLI remains legacy-only\n.*?"
              r"(?=\n      - name: Verify immutable P8 runtime boundary)",
              re.S,
          )
          workflow, count = p8_legacy_step.subn('', workflow, count=1)
          if count != 1:
              raise SystemExit(f'expected one historical P8 blob-pin step, got {count}')

          old_p8_preamble = """        run: |
          EXPECTED_QUERY_BLOB='4963cfbaf4306a03084f4513a1e324f649ce36e5'
          ACTUAL_QUERY_BLOB="$(git hash-object knowledge/design-references/scripts/query.mjs)"
          if [ "$ACTUAL_QUERY_BLOB" != "$EXPECTED_QUERY_BLOB" ]; then
            echo "P8 production query CLI changed: expected $EXPECTED_QUERY_BLOB got $ACTUAL_QUERY_BLOB" >&2
            exit 1
          fi
          node --input-type=module <<'NODE'
"""
          new_p8_preamble = """        run: |
          node --input-type=module <<'NODE'
"""
          if workflow.count(old_p8_preamble) != 1:
              raise SystemExit(f'expected one immutable P8 blob preamble, got {workflow.count(old_p8_preamble)}')
          workflow = workflow.replace(old_p8_preamble, new_p8_preamble)

          p11_steps = r'''      - name: Verify immutable P10 runtime projection evidence
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p10 = JSON.parse(fs.readFileSync('reference-graph/evidence/p10-runtime-projection-evidence.json', 'utf8'));
          const security = p10.runtime_security;
          const projection = p10.projection;
          const canary = p10.canary;
          if (p10.schema_version !== 'reference-graph.p10-runtime-projection.v1'
            || p10.base_sha !== '535a0f9e5354ba53493fc581d0eb5a60fca04e05'
            || p10.git_sha !== '25547b500038bc808a77ad31b41f142c2ce21f4c'
            || p10.production_source !== 'legacy-control'
            || p10.activation_performed !== false
            || p10.least_privilege_transport_ready !== true
            || p10.quick_shadow_canary_ready !== true
            || p10.production_activation_ready !== false
            || security?.service_role_used_by_canary !== false
            || security?.security_advisor_p9_p10_warn_error_count !== 0
            || projection?.candidate_count !== 275
            || projection?.complete_metadata_count !== 275
            || projection?.unique_legacy_id_count !== 275
            || projection?.equivalent !== true
            || canary?.case_count !== 24
            || canary?.exact_record_count !== 24
            || canary?.exact_pattern_count !== 24
            || canary?.mismatch_count !== 0
            || canary?.legacy_authoritative_count !== 24) {
            throw new Error(`immutable P10 evidence changed: ${JSON.stringify(p10)}`);
          }
          console.log('P10 runtime projection evidence remains immutable');
          NODE

      - name: Verify P11 production runtime default-off and profile isolation
        run: |
          echo "P11 default legacy; standard no-network; deep no-network"
          node --test tests/reference-graph/p11-runtime-router.test.mjs tests/reference-graph/p11-query-cli.test.mjs
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const source = fs.readFileSync('knowledge/design-references/scripts/query.mjs', 'utf8');
          for (const required of [
            'REFERENCE_GRAPH_QUICK_RUNTIME',
            'SUPABASE_PUBLISHABLE_KEY',
            'fetchP10QuickCandidatePool',
            'runP11RuntimeQuery',
            'timeoutMs: 1500',
          ]) {
            if (!source.includes(required)) throw new Error(`P11 production query is missing ${required}`);
          }
          if (!/graphMode === "graph"/.test(source)) throw new Error('P11 activation must require exact graph mode');
          if (!/request\.profile === "quick"/.test(source)) throw new Error('P11 graph transport must remain quick-only');
          console.log('P11 default legacy and standard/deep zero-network profile isolation verified');
          NODE

      - name: Verify P11 runtime source is benchmark independent and least privilege
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const files = [
            'knowledge/design-references/scripts/query.mjs',
            'reference-graph/p11-runtime-router.mjs',
            'reference-graph/p10-runtime-client.mjs',
          ];
          const benchmarkForbidden = /shadow-cases\.json|reference-graph\/evidence\/|p(?:7|8|9|10|11).*evidence\.json|expected[_-]?legacy|legacy[_-]?expected/i;
          const privilegeForbidden = /SUPABASE_SERVICE_ROLE_KEY|ReferenceGraphSupabaseStore|service[_-]?role[_-]?(?:key|token|secret)/i;
          for (const file of files) {
            const source = fs.readFileSync(file, 'utf8');
            if (benchmarkForbidden.test(source)) throw new Error(`P11 benchmark leakage detected in ${file}`);
            if (privilegeForbidden.test(source)) throw new Error(`P11 privileged runtime path detected in ${file}`);
          }
          const query = fs.readFileSync('knowledge/design-references/scripts/query.mjs', 'utf8');
          if (!query.includes('SUPABASE_PUBLISHABLE_KEY')) throw new Error('P11 runtime must use publishable auth');
          console.log('P11 runtime source is benchmark independent and publishable-only');
          NODE

'''
          anchor = "      - name: Measure current P5 legacy control health\n"
          if workflow.count(anchor) != 1:
              raise SystemExit(f'expected one P5 control anchor, got {workflow.count(anchor)}')
          workflow = workflow.replace(anchor, p11_steps + anchor)

          if "EXPECTED_QUERY_BLOB='4963cfbaf4306a03084f4513a1e324f649ce36e5'" in workflow:
              raise SystemExit('historical P8 query blob pin still present after P11 patch')
          if '010_reference_graph' in workflow:
              raise SystemExit('P11 must not introduce migration 010')

          Path('reference-graph/.p11-governance.yml').write_text(workflow)

          readme_path = Path('reference-graph/README.md')
          readme = readme_path.read_text()
          if '## P11 reversible quick runtime authority' in readme:
              raise SystemExit('P11 README section already exists unexpectedly')
          readme += r'''

## P11 reversible quick runtime authority

P11 connects the certified P10 current-date projection to the real production query entrypoint behind an explicit, reversible **quick-only** opt-in. The repository default remains `legacy-control`: when `REFERENCE_GRAPH_QUICK_RUNTIME` is unset or has any value other than the exact string `graph`, the quick path is the same legacy selector and performs no graph fetch.

An opt-in quick request may attempt graph transport only when `REFERENCE_GRAPH_QUICK_RUNTIME=graph` and both `SUPABASE_URL` and `SUPABASE_PUBLISHABLE_KEY` are present. Runtime transport reads the P10 RLS projection with publishable-key auth and a 1500 ms timeout; it never accepts or requires `SUPABASE_SERVICE_ROLE_KEY`.

Graph authority is fail-closed. The router computes the legacy result first, hydrates graph IDs back to canonical local records, derives patterns through the unchanged legacy pattern selector, and accepts graph authority only when the ordered record IDs are **exact** and the ordered pattern IDs are **exact** for the same request. Transport errors, missing credentials, stale or empty snapshots, malformed payloads, unknown IDs, record mismatch, or pattern mismatch all fall back to the already-computed legacy result without changing public JSON or exit semantics.

`standard` remains legacy-only and zero-network. `deep` remains legacy-only and zero-network. Usage is recorded exactly once after the authoritative result is chosen. P11 proves that the quick graph route can become activation-ready, but it performs **no global activation**: `repository_default_graph_enabled` stays false, `activation_performed` stays false, and production remains legacy by default until a later explicit operator decision.
'''
          Path('reference-graph/.p11-readme.md').write_text(readme)
          PY
          git config user.name "Wibias"
          git config user.email "37517432+Wibias@users.noreply.github.com"
          git add reference-graph/.p11-governance.yml reference-graph/.p11-readme.md
          git commit -m "chore: stage P11 governance and README patch"
          git push origin HEAD:agent/reference-graph-p11
