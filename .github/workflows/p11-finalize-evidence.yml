name: P11 finalize evidence

on:
  push:
    branches:
      - agent/reference-graph-p11
    paths:
      - .github/workflows/p11-finalize-evidence.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/reference-graph-p11
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build canonical P11 evidence through receipt finalizer
        run: |
          mkdir -p reference-graph/evidence
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {
            P11_PHASES,
            assertSecretFreeP11Receipt,
            createP11Receipt,
            finalizeP11Receipt,
            recordP11Phase,
          } from './reference-graph/p11-receipt.mjs';

          const binding = {
            purpose: 'agent-hub-reference-graph',
            project_ref: 'vrznfnxzlxaavpqbzbzd',
            project_name: 'agent-hub-reference-graph',
            region: 'eu-central-1',
          };
          const baseSha = '43a81a3fb2ee42e083c7ca4bf6d132663c54d51d';
          const gitSha = '849a8782be4081a5821bdb354e54c33b2e2b0fb9';
          const verificationAt = '2026-10-24T00:00:57.000Z';
          const referenceTime = '2026-10-24T00:00:33.000Z';

          let receipt = createP11Receipt({
            binding,
            baseSha,
            gitSha,
            verificationAt,
            referenceTime,
          });
          const details = {
            preflight: {
              verified: true,
              projection_snapshot_date: '2026-10-24',
              projection_candidate_count: 275,
              security_advisor_warn_error_count: 0,
            },
            router: {
              verified: true,
              public_output_parity_regression: true,
              governance_run_id: 40042873232,
            },
            live_canary: {
              verified: true,
              run_id: 40042748708,
              artifact_id: 12539867164,
              artifact_sha256: 'dfb1bdc8c622b8ff6de68a3cac35269f84bd88769ab61570e5345bbaffd45a37',
            },
            rollback: {
              verified: true,
              repository_default_graph_enabled: false,
              standard_deep_zero_network: true,
            },
          };
          for (const phase of P11_PHASES) {
            receipt = recordP11Phase(receipt, {
              phase,
              status: 'success',
              detail: details[phase],
            });
          }

          receipt = finalizeP11Receipt(receipt, {
            defaultOff: {
              verified: true,
              repository_default_graph_enabled: false,
              default_quick_legacy_equivalent: true,
              default_graph_fetch_count: 0,
            },
            liveActivatedCanary: {
              status: 'available',
              case_count: 24,
              authoritative_graph_count: 24,
              exact_record_count: 24,
              exact_pattern_count: 24,
              coverage_exit_exact_count: 24,
              mismatch_count: 0,
              auth_mode: 'publishable',
              candidate_count: 275,
              default_cli_equivalent_count: 24,
              reference_date: '2026-10-24',
              run_id: 40042748708,
              artifact_id: 12539867164,
              artifact_sha256: 'dfb1bdc8c622b8ff6de68a3cac35269f84bd88769ab61570e5345bbaffd45a37',
            },
            fallbackVerification: {
              transport_failure_fallback: true,
              missing_key_zero_fetch_fallback: true,
              stale_snapshot_fallback: true,
              empty_snapshot_fallback: true,
              malformed_payload_fallback: true,
              usage_exact_once_graph: true,
              usage_exact_once_fallback: true,
            },
            profileIsolation: {
              standard_legacy_only: true,
              deep_legacy_only: true,
              standard_fetch_count: 0,
              deep_fetch_count: 0,
            },
            security: {
              runtime_auth_mode: 'publishable',
              service_role_runtime_used: false,
              security_advisor_p9_p10_warn_error_count: 0,
              projection_refresh_operator_only: true,
            },
            blockers: [],
          });

          receipt.evidence = {
            implementation_governance_run_id: 40042873232,
            live_canary_run_id: 40042748708,
            live_canary_artifact_id: 12539867164,
            live_canary_artifact_sha256: 'dfb1bdc8c622b8ff6de68a3cac35269f84bd88769ab61570e5345bbaffd45a37',
            projection_snapshot_date: '2026-10-24',
            projection_candidate_count: 275,
            public_output_bug_found_and_regressed: true,
            repository_default_unchanged: true,
          };

          assertSecretFreeP11Receipt(receipt);
          if (receipt.quick_activation_ready !== true
            || receipt.repository_default_graph_enabled !== false
            || receipt.activation_performed !== false
            || receipt.production_source !== 'legacy-control') {
            throw new Error(`unexpected P11 final decision: ${JSON.stringify(receipt)}`);
          }
          fs.writeFileSync(
            'reference-graph/evidence/p11-quick-activation-evidence.json',
            `${JSON.stringify(receipt, null, 2)}\n`,
          );
          console.log(JSON.stringify({
            schema_version: receipt.schema_version,
            git_sha: receipt.git_sha,
            quick_activation_ready: receipt.quick_activation_ready,
            repository_default_graph_enabled: receipt.repository_default_graph_enabled,
            activation_performed: receipt.activation_performed,
            production_source: receipt.production_source,
            blockers: receipt.blockers,
          }, null, 2));
          NODE
          git config user.name "Wibias"
          git config user.email "37517432+Wibias@users.noreply.github.com"
          git add reference-graph/evidence/p11-quick-activation-evidence.json
          git commit -m "evidence: record P11 quick activation readiness"
          git push origin HEAD:agent/reference-graph-p11
