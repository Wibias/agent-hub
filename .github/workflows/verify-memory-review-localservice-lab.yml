name: Memory Review Authority LocalService lab (default OFF)

on:
  pull_request:
    paths:
      - 'memory-engine/authority-host/windows/MemoryReviewAuthority.LabService/**'
      - '.github/workflows/verify-memory-review-localservice-lab.yml'
  push:
    branches: [main]
    paths:
      - 'memory-engine/authority-host/windows/MemoryReviewAuthority.LabService/**'
      - '.github/workflows/verify-memory-review-localservice-lab.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disposable-scm-lane:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'ga'
      - name: Native build and negative service-identity policy tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $project = 'memory-engine/authority-host/windows/MemoryReviewAuthority.LabService/MemoryReviewAuthority.LabService.csproj'
          dotnet restore $project --runtime win-x64
          if ($LASTEXITCODE -ne 0) { throw "restore failed" }
          dotnet build $project -c Release --no-restore --runtime win-x64
          if ($LASTEXITCODE -ne 0) { throw "build failed" }
          dotnet run --project $project -c Release --no-restore --no-build --runtime win-x64 -- --policy-selftest
          if ($LASTEXITCODE -ne 0) { throw "identity policy failed" }
      - name: Publish disposable lab host (no production install)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $project = 'memory-engine/authority-host/windows/MemoryReviewAuthority.LabService/MemoryReviewAuthority.LabService.csproj'
          $target = Join-Path $env:RUNNER_TEMP 'agenthub-review-lab-publish'
          dotnet publish $project -c Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false --output $target
          if ($LASTEXITCODE -ne 0) { throw "publish failed" }
          "MEMORY_REVIEW_LAB_EXE=$target/MemoryReviewAuthority.LabService.exe" >> $env:GITHUB_ENV
      - name: Ephemeral restricted LocalService SCM startup and cleanup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./memory-engine/authority-host/windows/MemoryReviewAuthority.LabService/test-lab-service.ps1 -PublishedExe $env:MEMORY_REVIEW_LAB_EXE
