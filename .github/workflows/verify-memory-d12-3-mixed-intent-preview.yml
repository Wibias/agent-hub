name: Memory D12.3 mixed-intent read-only preview

on:
  pull_request:
    paths:
      - 'memory-engine/memory-atomic-*.mjs'
      - 'scripts/*memory-atomic-*.mjs'
      - 'tests/memory-engine/memory-atomic-*.test.mjs'
      - 'docs/memory-d12-3-atomic-shadow.md'
      - 'docs/memory-d12-3-review-provenance.md'
      - '.github/workflows/verify-memory-d12-3-mixed-intent-preview.yml'
  push:
    branches: [main]
    paths:
      - 'memory-engine/memory-atomic-*.mjs'
      - 'scripts/*memory-atomic-*.mjs'
      - 'tests/memory-engine/memory-atomic-*.test.mjs'
      - '.github/workflows/verify-memory-d12-3-mixed-intent-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Verify mixed-intent read-only capture preview without Claim writes
        run: >-
          node --test
          tests/memory-engine/memory-atomic-candidate-shadow.test.mjs
          tests/memory-engine/memory-atomic-shadow-db.test.mjs
          tests/memory-engine/memory-atomic-shadow-eval.test.mjs
          tests/memory-engine/memory-atomic-review-provenance.test.mjs
          tests/memory-engine/memory-atomic-rule-draft.test.mjs
