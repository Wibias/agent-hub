name: P4 Task 8 build evidence

on:
  pull_request:
    branches:
      - agent/reference-graph-p3

permissions:
  contents: read

jobs:
  build-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build P4 evidence through receipt contract
        run: |
          mkdir -p p4-evidence
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {
            assertSecretFreeP4Receipt,
            createP4Receipt,
            finalizeP4Receipt,
            recordP4Phase,
          } from './reference-graph/p4-receipt.mjs';

          const implementationSha = '72487cee8583fbdbb777788ed685da453f796796';
          const implementationRun = 39908919784;
          const verificationAt = '2026-10-23T06:00:52.000Z';
          const binding = JSON.parse(fs.readFileSync('reference-graph/target.json', 'utf8'));

          const revalidation = {
            target_count: 598,
            terminal_decision_count: 598,
            confirm_count: 273,
            stale_count: 325,
            archive_count: 0,
            complete: true,
          };
          const currentControlHealth = {
            reference_time: '2026-10-23T12:00:00.000Z',
            reviewed_accessible_count: 275,
            fresh_pool_count: 275,
            fresh_pool_rate: 1,
            fresh_surface_family_count: 12,
            fresh_platform_count: 2,
            case_count: 24,
            full_limit_case_count: 24,
            cases_with_coverage_gaps: 3,
            blockers: ['one or more control cases have coverage gaps'],
            healthy: false,
          };
          const embeddingCoverage = {
            eligible_chunk_count: 275,
            compatible_count: 275,
            missing_count: 0,
            text_hash_mismatch_count: 0,
            coverage_rate: 1,
          };
          const evaluations = {
            lexical: {
              status: 'blocked',
              reason: 'Current legacy control is unhealthy because 3 of 24 fixed cases have coverage gaps after honest full revalidation; P4 does not score current live retrieval against an unhealthy control.',
            },
            semantic: {
              status: 'blocked',
              reason: 'Exact-profile embeddings are complete, but current live quality scoring is blocked by unhealthy current control.',
            },
            hybrid: {
              status: 'blocked',
              reason: 'Exact-profile embeddings are complete, but current live quality scoring is blocked by unhealthy current control.',
            },
          };

          let receipt = createP4Receipt({
            binding,
            gitSha: implementationSha,
            verificationAt,
          });
          receipt = recordP4Phase(receipt, {
            phase: 'preflight', status: 'success', detail: {
              dedicated_target: true,
              migrations: [
                'reference_graph_001_schema',
                'reference_graph_002_rpc',
                'reference_graph_003_embeddings_rpc',
                'reference_graph_004_lexical_overlap',
                'reference_graph_005_freshness',
              ],
            },
          });
          receipt = recordP4Phase(receipt, {
            phase: 'revalidation', status: 'success', detail: {
              initial_plan_sha256: '48cde0c2962b6159c2ceb400dba6fb6a5e4e9d7e478517cea2991a0709e16939',
              initial_target_count: 598,
              initial_already_fresh_count: 2,
              initial_wave_count: 12,
              terminal_decision_count: 598,
              ordered_decision_hashes_sha256: '1fad111ddb23f2a039abfe1ac55dbe88c12a6ebbac57ed8bccc72d98dee23760',
              verifier: 'p4-source-analysis-audit-v1',
            },
          });
          receipt = recordP4Phase(receipt, {
            phase: 'import', status: 'success', detail: {
              sources: 576,
              assets: 600,
              chunks: 600,
              observations: 7264,
              tags: 868,
              relations: 0,
              current_assets: 600,
              verification_rows: 598,
            },
          });
          receipt = recordP4Phase(receipt, {
            phase: 'embeddings', status: 'success', detail: {
              profile_id: 'snowflake-arctic-embed-33m-raw-v1',
              model_id: 'ollama/snowflake-arctic-embed:33m',
              model_revision: 'e8db018629b4',
              dimensions: 384,
              persisted_total: 600,
              current_exact_coverage: embeddingCoverage,
              quality_status: 'experimental',
              cutover_approved: false,
            },
          });
          receipt = recordP4Phase(receipt, {
            phase: 'shadow', status: 'unavailable', detail: {
              reason: 'Current legacy control is unhealthy after honest revalidation; current lexical/semantic/hybrid scores are intentionally not promoted as comparable cutover evidence.',
              historical_benchmark_source: 'reference-graph/evidence/p3-live-shadow-evidence.json',
              historical_reference_time: '2026-07-21T12:00:00.000Z',
            },
          });
          receipt = finalizeP4Receipt(receipt, {
            revalidation,
            currentControlHealth,
            embeddingCoverage,
            evaluations,
            blockers: ['current control has coverage gaps after honest full revalidation'],
          });
          Object.assign(receipt, {
            phase: 'P4',
            recorded_at: verificationAt,
            decision: 'no-cutover',
            decision_reason: 'Full benchmark-independent revalidation and exact-profile embedding coverage succeeded, but the honest current legacy control still has coverage gaps in 3 of 24 fixed cases. P4 therefore does not score current live retrieval as comparable cutover evidence and production remains legacy-control.',
            cutover_thresholds: {
              min_cases: 20,
              min_comparable_cases: 20,
              min_average_overlap: 0.65,
              min_top1_retention: 0.75,
              max_empty_rate: 0.05,
              min_exact_surface_rate: 0.7,
              min_exact_platform_rate: 0.8,
            },
            historical_benchmark: {
              source: 'reference-graph/evidence/p3-live-shadow-evidence.json',
              immutable: true,
              reference_time: '2026-07-21T12:00:00.000Z',
              benchmark_control_health: {
                healthy: true,
                fresh_pool_count: 600,
                full_limit_case_count: 24,
                cases_with_coverage_gaps: 0,
              },
              lexical_summary: {
                case_count: 24,
                comparable_case_count: 24,
                average_overlap_at_k: 0.53125,
                legacy_top1_retention_rate: 0.7083333333333334,
                graph_empty_rate: 0,
                average_exact_surface_rate: 1,
                average_exact_platform_rate: 1,
                cutover_ready: false,
              },
            },
            live_target_snapshot: {
              sources: 576,
              assets: 600,
              chunks: 600,
              observations: 7264,
              tags: 868,
              relations: 0,
              embeddings: 600,
              verifications: 598,
              current_assets: 600,
            },
            security: {
              blocking_advisor_findings: 0,
              rls_enabled_no_policy_info: 12,
              rpc_access: {
                anon: 'denied',
                authenticated: 'denied',
                service_role: 'allowed',
              },
            },
            performance: {
              blocking_advisor_findings: 0,
              unindexed_foreign_keys_info: 2,
              unused_indexes_info: 2,
            },
            verification: {
              implementation_git_sha: implementationSha,
              reference_graph_governance_run: implementationRun,
              tests: 124,
              passes: 124,
              failures: 0,
              control_evidence_run: 39908791650,
              control_evidence_artifact_sha256: 'a53c3a22f9ca84501bc45763289e6e46b77ecd8aa672b1f7531332932f0c6e52',
              release_governance: {
                status: 'inherited-base-failure',
                reason: 'Unchanged baseline skill-catalog check requires missing skills/write-swift/SKILL.md; this predates P4 and is not repaired here.',
              },
            },
          });
          assertSecretFreeP4Receipt(receipt);

          const revalidationEvidence = {
            schema_version: 'reference-graph.p4-revalidation-evidence.v1',
            recorded_at: verificationAt,
            implementation_git_sha: implementationSha,
            frozen_population: {
              reference_date: '2026-10-23',
              plan_sha256: '48cde0c2962b6159c2ceb400dba6fb6a5e4e9d7e478517cea2991a0709e16939',
              freeze_run: 39901552303,
              freeze_artifact_id: 12479580040,
              freeze_artifact_zip_sha256: 'bee56c1db5e5c198f1056cf840798ab5574e8702d50acce6ae35cb846247208e',
              target_count: 598,
              already_fresh_count: 2,
              excluded_count: 0,
              wave_count: 12,
              benchmark_independent: true,
            },
            execution: {
              verifier: 'p4-source-analysis-audit-v1',
              terminal_decision_count: 598,
              confirm_count: 273,
              stale_count: 325,
              archive_count: 0,
              unresolved_count: 0,
              verified_at: '2026-10-23',
              access_status_by_verdict: {
                confirm: { AVAILABLE: 273 },
                stale: { AVAILABLE: 305, BLOCKED: 11, UNAVAILABLE: 9 },
              },
              decision_hash_binding: {
                algorithm: 'sha256',
                canonicalization: 'concatenate decision_hash ordered by legacy_id',
                digest: '1fad111ddb23f2a039abfe1ac55dbe88c12a6ebbac57ed8bccc72d98dee23760',
                live_ledger_row_count: 598,
              },
              complete: true,
            },
            post_revalidation: {
              reviewed_accessible_fresh_count: 275,
              stale_count: 325,
              current_control_healthy: false,
              current_control_coverage_gap_cases: 3,
            },
            safety: {
              no_benchmark_membership_used_for_targeting: true,
              no_ttl_widening: true,
              no_link_health_only_confirmation: true,
              production_source: 'legacy-control',
            },
          };
          assertSecretFreeP4Receipt(revalidationEvidence);

          fs.writeFileSync('p4-evidence/p4-revalidation-results.json', `${JSON.stringify(revalidationEvidence, null, 2)}\n`);
          fs.writeFileSync('p4-evidence/p4-freshness-quality-evidence.json', `${JSON.stringify(receipt, null, 2)}\n`);
          console.log(JSON.stringify({
            implementation_git_sha: implementationSha,
            cutover_ready: receipt.cutover_ready,
            eligible_for_cutover_review: receipt.eligible_for_cutover_review,
            production_source: receipt.production_source,
            blockers: receipt.blockers,
          }, null, 2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: p4-final-evidence
          path: p4-evidence/*.json
          if-no-files-found: error
