name: P3 export live evidence inputs

on:
  pull_request:
    branches:
      - agent/reference-graph-p2

permissions:
  contents: read

jobs:
  export:
    if: github.head_ref == 'agent/reference-graph-p3'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Generate exact P3 import captures
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          import { loadRecords } from './knowledge/design-references/scripts/lib.mjs';
          import { planLegacyCatalogImport } from './reference-graph/catalog-import.mjs';

          const plan = planLegacyCatalogImport(loadRecords());
          const artifact = {
            record_count: plan.record_count,
            capture_count: plan.capture_count,
            source_count: plan.source_count,
            asset_count: plan.asset_count,
            deduplicated_assets: plan.deduplicated_assets,
            captures: plan.captures,
          };
          writeFileSync('p3-live-import-captures.json', JSON.stringify(artifact), 'utf8');
          console.log(JSON.stringify({
            record_count: artifact.record_count,
            capture_count: artifact.capture_count,
            source_count: artifact.source_count,
            asset_count: artifact.asset_count,
            deduplicated_assets: artifact.deduplicated_assets,
          }));
          NODE

      - name: Generate exact P3 shadow input
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { loadRecords } from './knowledge/design-references/scripts/lib.mjs';
          import { selectRecords } from './knowledge/design-references/scripts/selection.mjs';
          import {
            assessLegacyControlHealth,
            shadowQueryText,
          } from './reference-graph/shadow-eval.mjs';

          const BENCHMARK_CONTROL_TIME = '2026-07-21T12:00:00.000Z';
          const records = loadRecords();
          const cases = JSON.parse(readFileSync('./reference-graph/shadow-cases.json', 'utf8'));
          const benchmark = new Date(BENCHMARK_CONTROL_TIME);
          const currentNow = new Date();

          const artifact = {
            generated_at: currentNow.toISOString(),
            production_source: 'legacy-control',
            control_reference_time: benchmark.toISOString(),
            control_health: assessLegacyControlHealth({ records, cases, now: benchmark }),
            current_control_health: assessLegacyControlHealth({ records, cases, now: currentNow }),
            cases: cases.map((request) => {
              const legacy = selectRecords(records, request, { now: benchmark });
              return {
                request,
                query: shadowQueryText(request),
                filters: {
                  platform: request.platform || undefined,
                  surface_family: request.surface || undefined,
                },
                max_items: request.limit,
                legacy_ids: legacy.selected.map((row) => row.id),
              };
            }),
          };

          writeFileSync('p3-shadow-input.json', JSON.stringify(artifact), 'utf8');
          console.log(JSON.stringify({
            generated_at: artifact.generated_at,
            production_source: artifact.production_source,
            control_reference_time: artifact.control_reference_time,
            case_count: artifact.cases.length,
            control_healthy: artifact.control_health.healthy,
            current_control_healthy: artifact.current_control_health.healthy,
            current_fresh_pool_count: artifact.current_control_health.fresh_pool_count,
          }));
          NODE

      - name: Upload exact captures
        uses: actions/upload-artifact@v4
        with:
          name: p3-live-import-captures
          path: p3-live-import-captures.json
          if-no-files-found: error
          retention-days: 1

      - name: Upload exact shadow input
        uses: actions/upload-artifact@v4
        with:
          name: p3-shadow-input
          path: p3-shadow-input.json
          if-no-files-found: error
          retention-days: 1
