name: P5 finalize evidence once

on:
  push:
    branches:
      - agent/reference-graph-p5
    paths:
      - .github/workflows/p5-evidence-finalize-once.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/reference-graph-p5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build canonical final P5 evidence
        env:
          FINAL_IMPLEMENTATION_SHA: 2d235a6fb27cb96cbec208c776109086305c6c64
          FINAL_IMPLEMENTATION_GOVERNANCE_RUN: '39918274827'
          LIVE_MEASUREMENT_SHA: ffe3c92227a2711238a57b3e9e17183355d12562
          LIVE_MEASUREMENT_GOVERNANCE_RUN: '39914612340'
          TASK6_VERIFICATION_RUN: '39914465189'
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {
            createP5Receipt,
            recordP5Phase,
            finalizeP5Receipt,
            assertSecretFreeP5Receipt,
          } from './reference-graph/p5-receipt.mjs';

          const livePath = './reference-graph/evidence/p5-live-shadow-evidence.json';
          const controlPath = './reference-graph/evidence/p5-control-coverage-evidence.json';
          const live = JSON.parse(fs.readFileSync(livePath, 'utf8'));
          const control = JSON.parse(fs.readFileSync(controlPath, 'utf8'));
          const binding = {
            purpose: live.target.purpose,
            project_ref: live.target.project_ref,
            project_name: live.target.project_name,
            region: live.target.region,
          };

          let receipt = createP5Receipt({
            binding,
            gitSha: process.env.FINAL_IMPLEMENTATION_SHA,
            verificationAt: new Date().toISOString(),
            referenceTime: live.reference_time,
          });
          for (const phase of ['preflight', 'selector', 'embeddings', 'shadow']) {
            receipt = recordP5Phase(receipt, { phase, status: 'success' });
          }
          receipt = finalizeP5Receipt(receipt, {
            selectorContract: control.selector_contract,
            currentControlHealth: live.current_control_health,
            embeddingCoverage: live.embedding_coverage,
            evaluations: live.evaluations,
          });
          assertSecretFreeP5Receipt(receipt, []);

          if (receipt.production_source !== 'legacy-control') throw new Error('unexpected production source');
          if (receipt.eligible_for_cutover_review !== false || receipt.cutover_ready !== false) {
            throw new Error('P5 live evidence must remain no-cutover');
          }
          if (receipt.current_control_health.full_limit_case_count !== 24
              || receipt.current_control_health.cases_with_coverage_gaps !== 0) {
            throw new Error('current control structural gate mismatch');
          }
          if (receipt.embedding_coverage.compatible_count !== 275
              || receipt.embedding_coverage.missing_count !== 0
              || receipt.embedding_coverage.text_hash_mismatch_count !== 0) {
            throw new Error('embedding coverage mismatch');
          }

          const finalizedAt = receipt.verification_at;
          live.receipt_finalized_at = finalizedAt;
          live.implementation = {
            sha: process.env.FINAL_IMPLEMENTATION_SHA,
            reference_graph_governance_run: Number(process.env.FINAL_IMPLEMENTATION_GOVERNANCE_RUN),
            task6_verification_run: Number(process.env.TASK6_VERIFICATION_RUN),
            live_measurement_sha: process.env.LIVE_MEASUREMENT_SHA,
            live_measurement_reference_graph_governance_run: Number(process.env.LIVE_MEASUREMENT_GOVERNANCE_RUN),
            retrieval_behavior_unchanged_since_measurement: true,
            receipt_finalization_run: Number(process.env.GITHUB_RUN_ID),
          };
          live.receipt = receipt;
          live.receipt_contract = {
            builder: 'finalizeP5Receipt',
            secret_check: 'assertSecretFreeP5Receipt',
            structural_gate_fix_sha: process.env.FINAL_IMPLEMENTATION_SHA,
          };

          control.finalized_at = finalizedAt;
          control.stack = {
            ...control.stack,
            implementation_sha: process.env.FINAL_IMPLEMENTATION_SHA,
            implementation_reference_graph_governance_run: Number(process.env.FINAL_IMPLEMENTATION_GOVERNANCE_RUN),
            task6_verification_run: Number(process.env.TASK6_VERIFICATION_RUN),
            live_measurement_sha: process.env.LIVE_MEASUREMENT_SHA,
            live_measurement_reference_graph_governance_run: Number(process.env.LIVE_MEASUREMENT_GOVERNANCE_RUN),
            receipt_gate_fix_sha: process.env.FINAL_IMPLEMENTATION_SHA,
          };

          fs.writeFileSync(livePath, `${JSON.stringify(live, null, 2)}\n`);
          fs.writeFileSync(controlPath, `${JSON.stringify(control, null, 2)}\n`);
          NODE

          node --test tests/reference-graph/p5-receipt.test.mjs tests/reference-graph/p5-receipt-structural-gates.test.mjs
      - name: Commit finalized evidence
        run: |
          git config user.name "Wibias"
          git config user.email "37517432+Wibias@users.noreply.github.com"
          git add reference-graph/evidence/p5-control-coverage-evidence.json reference-graph/evidence/p5-live-shadow-evidence.json
          git diff --cached --check
          git commit -m "chore: bind P5 evidence to final receipt gate"
          git push origin HEAD:agent/reference-graph-p5
