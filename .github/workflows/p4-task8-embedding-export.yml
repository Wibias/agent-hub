name: P4 Task 8 embedding export

on:
  pull_request:

permissions:
  contents: read

jobs:
  export:
    if: github.event.pull_request.head.ref == 'agent/reference-graph-p4'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Start isolated Ollama container
        run: |
          docker pull ollama/ollama:latest
          docker run -d --name p4-ollama -p 11434:11434 ollama/ollama:latest
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null
      - name: Pull exact pinned model
        run: |
          docker exec p4-ollama ollama pull snowflake-arctic-embed:33m
          curl -fsS http://127.0.0.1:11434/api/tags > p4-ollama-tags.json
          node - <<'NODE'
          const fs = require('node:fs');
          const tags = JSON.parse(fs.readFileSync('p4-ollama-tags.json', 'utf8'));
          const model = tags.models.find((row) => row.name === 'snowflake-arctic-embed:33m' || row.model === 'snowflake-arctic-embed:33m');
          if (!model) throw new Error('pinned Snowflake model missing after pull');
          if (!String(model.digest || '').toLowerCase().startsWith('e8db018629b4')) {
            throw new Error(`digest mismatch: ${model.digest}`);
          }
          console.log(JSON.stringify({ model: model.name || model.model, digest: model.digest }, null, 2));
          NODE
      - name: Export exact-profile document embeddings
        env:
          OLLAMA_URL: http://127.0.0.1:11434
        run: |
          node reference-graph/cli/embed-design-references.mjs --export-rows p4-embedding-export.json --embed-batch-size 32 | tee p4-embedding-export-summary.json
          sha256sum p4-embedding-export.json | tee p4-embedding-export.sha256
          python3 skills/security-review-redirect/scripts/scan_secrets.py p4-embedding-export.json
          node - <<'NODE'
          const fs = require('node:fs');
          const artifact = JSON.parse(fs.readFileSync('p4-embedding-export.json', 'utf8'));
          if (artifact.embedding_count !== 600 || artifact.rows.length !== 600) {
            throw new Error(`expected 600 embedding rows, got ${artifact.embedding_count}/${artifact.rows.length}`);
          }
          if (artifact.model_id !== 'ollama/snowflake-arctic-embed:33m' || artifact.model_revision !== 'e8db018629b4' || artifact.dimensions !== 384) {
            throw new Error('embedding artifact profile mismatch');
          }
          console.log(JSON.stringify({ embedding_count: artifact.embedding_count, model_id: artifact.model_id, model_revision: artifact.model_revision, dimensions: artifact.dimensions }, null, 2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: p4-exact-snowflake-embeddings
          path: |
            p4-embedding-export.json
            p4-embedding-export.sha256
            p4-embedding-export-summary.json
            p4-ollama-tags.json
          if-no-files-found: error
