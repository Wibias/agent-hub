name: Temporary statechart vendor sync

on:
  push:
    branches:
      - agent/statechart-compiler-refresh
    paths:
      - .github/workflows/statechart-vendor-sync-temp.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/statechart-compiler-refresh

      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0

      - name: Copy pinned upstream statechart compiler
        shell: bash
        run: |
          set -euo pipefail
          upstream_sha='c742dd61706fbacc1b95f1a20b7b988cf096ce6c'
          upstream_dir="$RUNNER_TEMP/cursor-plugins"
          git clone --filter=blob:none --no-checkout https://github.com/cursor/plugins.git "$upstream_dir"
          git -C "$upstream_dir" fetch --depth=1 origin "$upstream_sha"
          git -C "$upstream_dir" checkout --detach FETCH_HEAD

          target='skills/formal-verification/statechart'
          rm -rf "$target/scripts" "$target/references"
          mkdir -p "$target"
          cp -a "$upstream_dir/pstack/skills/statechart/scripts" "$target/scripts"
          cp -a "$upstream_dir/pstack/skills/statechart/references" "$target/references"
          rm -rf "$target/scripts/test"

          test "$(git -C "$upstream_dir" rev-parse HEAD)" = "$upstream_sha"
          test -f "$target/scripts/statechart.ts"
          test -f "$target/scripts/worker.ts"
          test -f "$target/references/render.md"
          test ! -e "$target/scripts/statechart.mjs"

      - name: Prove the new runtime gate goes green
        run: node --test skills/formal-verification/tests/statechart-runtime.test.mjs

      - name: Commit exact vendor snapshot and remove this temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/statechart-vendor-sync-temp.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A skills/formal-verification/statechart .github/workflows/statechart-vendor-sync-temp.yml
          git diff --cached --check
          git commit -m 'chore(statechart): vendor current TypeScript compiler'
          git push origin HEAD:agent/statechart-compiler-refresh
