name: Evidence-first Git prose

on:
  push:
    branches:
      - feat/evidence-first-git-prose

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test tests/skill-catalog/evidence-first-git-prose.test.mjs
