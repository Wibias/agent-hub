name: P10 projection DB smoke

on:
  push:
    branches:
      - agent/reference-graph-p10
    paths:
      - .github/workflows/p10-projection-db-smoke.yml

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/reference-graph-p10
      - name: Bootstrap roles and migrations 001 through 009
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          create schema if not exists extensions;
          do $$
          begin
            if not exists (select 1 from pg_roles where rolname = 'anon') then create role anon nologin; end if;
            if not exists (select 1 from pg_roles where rolname = 'authenticated') then create role authenticated nologin; end if;
            if not exists (select 1 from pg_roles where rolname = 'service_role') then create role service_role nologin; end if;
          end
          $$;
          SQL
          for f in reference-graph/schema/00{1..9}_*.sql; do
            echo "applying $f"
            psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Verify P10 projection refresh and runtime privilege boundary
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          insert into reference_graph.sources (id, canonical_url, source_kind, source_family, metadata)
          values (
            'a0000000-0000-5000-8000-000000000001',
            'https://example.com/p10',
            'test',
            'p10-family',
            '{"access_status":"AVAILABLE"}'::jsonb
          );

          insert into reference_graph.assets (
            id, source_id, asset_kind, canonical_locator, captured_at, content_hash, provenance, metadata
          ) values (
            'a0000000-0000-5000-8000-000000000011',
            'a0000000-0000-5000-8000-000000000001',
            'web-page',
            'https://example.com/p10/page',
            current_date,
            'p10-content',
            jsonb_build_object('review_status','reviewed','last_verified_at',current_date::text),
            jsonb_build_object(
              'legacy_id','p10-ref',
              'product','P10',
              'surface_family','public-home',
              'platform','web-responsive',
              'page_role','landing',
              'motion','static',
              'source_family','p10-family',
              'access_status','AVAILABLE',
              'evidence_class','TESTED',
              'ordinary_or_failure_prone',true,
              'multi_state_flow',false,
              'ttl_days',90
            )
          );

          insert into reference_graph.chunks (id, asset_id, ordinal, content, metadata)
          values (
            'a0000000-0000-5000-8000-000000000021',
            'a0000000-0000-5000-8000-000000000011',
            0,
            'p10 quick runtime projection',
            '{"text_hash":"p10-hash"}'::jsonb
          );

          set role service_role;
          select public.reference_graph_refresh_quick_runtime_projection_p10();
          reset role;

          select 1 / case when count(*) = 1 then 1 else 0 end as owner_projection_count_ok
          from public.reference_graph_quick_runtime_projection_p10;

          set role anon;
          select 1 / case when count(*) = 1 then 1 else 0 end as anon_current_snapshot_ok
          from public.reference_graph_quick_runtime_projection_p10;
          reset role;

          set role authenticated;
          select 1 / case when count(*) = 1 then 1 else 0 end as authenticated_current_snapshot_ok
          from public.reference_graph_quick_runtime_projection_p10;
          reset role;

          update public.reference_graph_quick_runtime_projection_p10
          set snapshot_date = current_date - 1;

          set role anon;
          select 1 / case when count(*) = 0 then 1 else 0 end as stale_snapshot_hidden_ok
          from public.reference_graph_quick_runtime_projection_p10;
          reset role;

          set role service_role;
          select public.reference_graph_refresh_quick_runtime_projection_p10();
          reset role;

          select 1 / case when not has_function_privilege('anon', 'public.reference_graph_quick_candidate_pool_runtime_p9()', 'EXECUTE') then 1 else 0 end as p9_anon_closed_ok;
          select 1 / case when not has_function_privilege('authenticated', 'public.reference_graph_quick_candidate_pool_runtime_p9()', 'EXECUTE') then 1 else 0 end as p9_authenticated_closed_ok;
          select 1 / case when not has_function_privilege('anon', 'public.reference_graph_refresh_quick_runtime_projection_p10()', 'EXECUTE') then 1 else 0 end as p10_refresh_anon_closed_ok;
          select 1 / case when not has_function_privilege('authenticated', 'public.reference_graph_refresh_quick_runtime_projection_p10()', 'EXECUTE') then 1 else 0 end as p10_refresh_authenticated_closed_ok;
          select 1 / case when has_function_privilege('service_role', 'public.reference_graph_refresh_quick_runtime_projection_p10()', 'EXECUTE') then 1 else 0 end as p10_refresh_service_ok;
          SQL

          if psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -c "set role anon; insert into public.reference_graph_quick_runtime_projection_p10(asset_id,legacy_id,ordinary_or_failure_prone,multi_state_flow,tags,search_text,snapshot_date,refreshed_at) values ('a0000000-0000-5000-8000-000000000099','forbidden',false,false,'[]','x',current_date,now());"; then
            echo "anon unexpectedly inserted into P10 projection" >&2
            exit 1
          fi
          if psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -c "set role authenticated; update public.reference_graph_quick_runtime_projection_p10 set search_text='forbidden';"; then
            echo "authenticated unexpectedly updated P10 projection" >&2
            exit 1
          fi
          if psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -c "set role anon; delete from public.reference_graph_quick_runtime_projection_p10;"; then
            echo "anon unexpectedly deleted from P10 projection" >&2
            exit 1
          fi
          if psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -c "set role anon; select public.reference_graph_quick_candidate_pool_runtime_p9();"; then
            echo "anon unexpectedly executed P9 runtime wrapper" >&2
            exit 1
          fi
          if psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -c "set role authenticated; select public.reference_graph_refresh_quick_runtime_projection_p10();"; then
            echo "authenticated unexpectedly executed P10 refresh" >&2
            exit 1
          fi
          if psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -c "set role anon; select * from reference_graph.sources limit 1;"; then
            echo "anon unexpectedly selected an underlying Reference Graph table" >&2
            exit 1
          fi
