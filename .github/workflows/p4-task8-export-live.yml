name: P4 Task 8 export live payload

on:
  pull_request:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate revalidated catalog and export deterministic captures
        run: |
          node knowledge/design-references/scripts/validate.mjs --production > p4-production-validation.json
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          import { loadRecords } from './knowledge/design-references/scripts/lib.mjs';
          import { planLegacyCatalogImport } from './reference-graph/catalog-import.mjs';
          const records = loadRecords();
          const plan = planLegacyCatalogImport(records);
          writeFileSync('p4-import-captures.json', JSON.stringify(plan.captures));
          const status = records.reduce((acc, row) => {
            acc[row.reviewStatus] = (acc[row.reviewStatus] ?? 0) + 1;
            return acc;
          }, {});
          writeFileSync('p4-import-summary.json', JSON.stringify({
            record_count: plan.record_count,
            capture_count: plan.capture_count,
            status,
          }, null, 2) + '\n');
          console.log(JSON.stringify({ record_count: plan.record_count, capture_count: plan.capture_count, status }, null, 2));
          NODE
          sha256sum p4-import-captures.json | tee p4-import-captures.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: p4-live-import-payload
          path: |
            p4-production-validation.json
            p4-import-captures.json
            p4-import-summary.json
            p4-import-captures.sha256
          if-no-files-found: error
