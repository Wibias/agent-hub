name: Design Foundations Index Refresh

on:
  push:
    branches:
      - agent/design-foundations-refresh

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/design-foundations-refresh
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate knowledge index
        run: node knowledge/build-index.mjs
      - name: Commit generated index when changed
        run: |
          if git diff --quiet -- knowledge/INDEX.md knowledge/index.json; then
            echo "Index already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add knowledge/INDEX.md knowledge/index.json
          git commit -m "chore: refresh knowledge index"
          git push origin HEAD:agent/design-foundations-refresh
