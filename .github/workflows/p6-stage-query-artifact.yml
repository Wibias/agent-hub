name: P6 stage query artifact

on:
  push:
    branches:
      - agent/reference-graph-p6
    paths:
      - .github/workflows/p6-stage-query-artifact.yml

permissions:
  actions: read
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/reference-graph-p6
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: p5-query-embeddings
          path: /tmp/p5-query
          github-token: ${{ github.token }}
          run-id: 39914965493
      - name: Verify and stage exact artifact
        run: |
          FILE=/tmp/p5-query/p5-query-embeddings.json
          test -f "$FILE"
          echo "76a1af99643b1ca5a53bf114ffca8f0c942462693a8eda9cc43afebcd26316ac  $FILE" | sha256sum -c -
          cp "$FILE" reference-graph/.p6-live-query-embeddings.json
          git config user.name "Wibias"
          git config user.email "37517432+Wibias@users.noreply.github.com"
          git add reference-graph/.p6-live-query-embeddings.json
          git commit -m "chore: stage exact P6 live query artifact"
          git push origin HEAD:agent/reference-graph-p6
