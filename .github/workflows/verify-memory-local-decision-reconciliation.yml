name: Memory Local Decision Reconciliation D12.3

on:
  pull_request:
    paths:
      - "scripts/reconcile-memory-review-decisions.mjs"
      - "tests/memory-engine/memory-local-decision-reconciliation.test.mjs"
      - "docs/memory-d12-3-readonly-decision-reconciliation.md"
      - ".github/workflows/verify-memory-local-decision-reconciliation.yml"
  push:
    branches: [main]
    paths:
      - "scripts/reconcile-memory-review-decisions.mjs"
      - "tests/memory-engine/memory-local-decision-reconciliation.test.mjs"
      - "docs/memory-d12-3-readonly-decision-reconciliation.md"
      - ".github/workflows/verify-memory-local-decision-reconciliation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Verify read-only intent reconciliation and drift blockers
        run: |
          node --check scripts/reconcile-memory-review-decisions.mjs
          node --test tests/memory-engine/memory-local-decision-reconciliation.test.mjs
