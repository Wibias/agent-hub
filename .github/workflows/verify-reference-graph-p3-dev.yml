name: Reference Graph P3 dev

on:
  push:
    branches:
      - agent/reference-graph-p3
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reference-graph-p3-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test reference graph contracts
        run: node --test tests/reference-graph/*.test.mjs
