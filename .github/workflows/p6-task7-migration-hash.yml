name: P6 task7 migration hash

on:
  push:
    branches:
      - agent/reference-graph-p6
    paths:
      - .github/workflows/p6-task7-migration-hash.yml

permissions:
  contents: read

jobs:
  hash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hash migration 006
        run: sha256sum reference-graph/schema/006_reference_graph_retrieval_quality.sql
