name: DWA handoff integrity

on:
  pull_request:
    paths:
      - 'skills/design-with-ai/SKILL.md'
      - 'skills/design-with-ai/references/developer-handoff.md'
      - 'skills/design-with-ai/references/design-first-prompting.md'
      - 'skills/design-with-ai/references/design-decision-lineage.md'
      - 'skills/design-with-ai/tests/evals/cases.jsonl'
      - 'skills/design-with-ai/tests/design-handoff-contract.test.mjs'
      - '.github/workflows/verify-dwa-handoff-playground.yml'
  push:
    branches: [main]
    paths:
      - 'skills/design-with-ai/SKILL.md'
      - 'skills/design-with-ai/references/developer-handoff.md'
      - 'skills/design-with-ai/references/design-first-prompting.md'
      - 'skills/design-with-ai/references/design-decision-lineage.md'
      - 'skills/design-with-ai/tests/evals/cases.jsonl'
      - 'skills/design-with-ai/tests/design-handoff-contract.test.mjs'
      - '.github/workflows/verify-dwa-handoff-playground.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: handoff-contract (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check handoff and decision lineage contracts
        run: node --test skills/design-with-ai/tests/design-handoff-contract.test.mjs skills/design-with-ai/tests/validate-design-decision.test.mjs
      - name: Validate DWA skill structure and locked regressions
        run: node skills/skill-ratchet/scripts/skill-ratchet.mjs validate --skill-root skills/design-with-ai --json
