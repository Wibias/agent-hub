name: Video production index refresh

on:
  pull_request:
    paths:
      - '.github/workflows/video-production-index-refresh.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Regenerate and commit knowledge index only
        run: |
          node knowledge/build-index.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- knowledge/INDEX.md knowledge/index.json
          if git diff --cached --quiet; then
            echo "Generated index already current"
            exit 0
          fi
          git commit -m "chore: refresh video production index"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
