name: Final evidence-first Git prose verification

on:
  push:
    branches:
      - feat/evidence-first-git-prose

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Normalize fixture and self-clean
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('skills/github-delivery/tests/evals/cases.jsonl')
          text = p.read_text()
          fixed = text.replace('\\u2014', '—')
          if fixed == text:
              raise SystemExit('expected escaped em-dash cleanup was not present')
          p.write_text(fixed)
          PY
          rm .github/workflows/evidence-first-git-prose.yml
          rm .github/workflows/final-evidence-first-git-prose.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skills/github-delivery/tests/evals/cases.jsonl .github/workflows/evidence-first-git-prose.yml .github/workflows/final-evidence-first-git-prose.yml
          git commit -m "Finalize evidence-first Git prose verification state"
          git push origin HEAD:feat/evidence-first-git-prose
      - name: Confirm exact clean head
        run: |
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/feat/evidence-first-git-prose)"
          test ! -e .github/workflows/evidence-first-git-prose.yml
          test ! -e .github/workflows/final-evidence-first-git-prose.yml
          git diff --check origin/main...HEAD
      - name: Run skill-catalog tests
        run: node --test tests/skill-catalog/*.test.mjs
      - name: Validate github-delivery offline evals
        working-directory: skills/github-delivery
        run: npm run evals:offline
      - name: Run Skill Ratchet structural gate
        run: node scripts/skill-ratchet.mjs validate --skill-root "$(pwd)/skills/github-delivery"
      - name: Show final diff
        run: git diff --stat origin/main...HEAD && git diff --name-status origin/main...HEAD
