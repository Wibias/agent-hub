name: P12 stage permanent governance

on:
  push:
    branches:
      - agent/reference-graph-p12
    paths:
      - .github/workflows/p12-stage-governance.yml

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/reference-graph-p12
          fetch-depth: 0
      - name: Stage P12 governance and README as ordinary blobs
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workflow_path = Path('.github/workflows/verify-reference-graph.yml')
          workflow = workflow_path.read_text()

          import_anchor = "          import { assertSecretFreeP11Receipt } from './reference-graph/p11-receipt.mjs';\n"
          import_insert = import_anchor + "          import { assertSecretFreeP12Receipt } from './reference-graph/p12-receipt.mjs';\n"
          if workflow.count(import_anchor) != 1:
              raise SystemExit('unexpected P11 receipt import anchor count')
          workflow = workflow.replace(import_anchor, import_insert, 1)

          scan_anchor = "          NODE\n\n      - name: Scan Reference Graph tree for common secrets\n"
          p12_scan = """          for (const file of [
            'reference-graph/evidence/p12-activation-authority-evidence.json',
          ]) {
            if (!existsSync(file)) continue;
            const value = JSON.parse(readFileSync(file, 'utf8'));
            assertSecretFreeP12Receipt(value);
            console.log(`secret-free: ${file}`);
          }

          NODE

      - name: Scan Reference Graph tree for common secrets
"""
          if workflow.count(scan_anchor) != 1:
              raise SystemExit('unexpected secret-scan terminator anchor count')
          workflow = workflow.replace(scan_anchor, p12_scan, 1)

          step_anchor = "      - name: Measure current P5 legacy control health\n"
          p12_steps = r'''      - name: Verify P12 activation binding and final P11 readiness
        run: |
          node reference-graph/cli/p12-activation-preflight.mjs --plan > /tmp/reference-graph-p12-plan.json
          node reference-graph/cli/p12-activation-preflight.mjs --verify-repository > /tmp/reference-graph-p12-repository.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const finalP11EvidenceHead = '541e9667ea28c75de5492b79d84edf89f9cac8ac';
          const p11 = JSON.parse(fs.readFileSync('reference-graph/evidence/p11-quick-activation-evidence.json', 'utf8'));
          const plan = JSON.parse(fs.readFileSync('/tmp/reference-graph-p12-plan.json', 'utf8'));
          const repository = JSON.parse(fs.readFileSync('/tmp/reference-graph-p12-repository.json', 'utf8'));
          if (p11.schema_version !== 'reference-graph.p11-activation-readiness.v1'
            || p11.quick_activation_ready !== true
            || p11.production_source !== 'legacy-control'
            || p11.repository_default_graph_enabled !== false
            || p11.activation_performed !== false) {
            throw new Error(`immutable P11 readiness changed: ${JSON.stringify(p11)}`);
          }
          if (plan.grant_state !== 'not-issued'
            || plan.activation_authorized !== false
            || plan.activation_performed !== false
            || plan.repository_default_graph_enabled !== false
            || plan.production_source !== 'legacy-control') {
            throw new Error(`P12 plan crossed the authority boundary: ${JSON.stringify(plan)}`);
          }
          if (repository.activation_binding?.p11_evidence_head !== finalP11EvidenceHead
            || repository.activation_binding?.p11_implementation_sha !== p11.git_sha
            || repository.repository?.p11_evidence_head_matches !== true
            || repository.repository?.repository_default_graph_enabled !== false
            || repository.repository?.migration_010_present !== false
            || repository.repository?.service_role_runtime_reference !== false
            || !/^[0-9a-f]{64}$/.test(repository.binding_hash ?? '')) {
            throw new Error(`P12 activation binding is not repository-clean: ${JSON.stringify(repository)}`);
          }
          console.log(JSON.stringify({ finalP11EvidenceHead, binding_hash: repository.binding_hash }, null, 2));
          NODE

      - name: Verify P12 activation authority remains non-executable
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const files = [
            'reference-graph/p12-activation-authority.mjs',
            'reference-graph/p12-receipt.mjs',
            'reference-graph/cli/p12-activation-preflight.mjs',
          ];
          const benchmarkForbidden = /shadow-cases\.json|authenticated-home-mobile|auth-mobile|design-system-mobile|expected[_-]?legacy|legacy[_-]?expected|p(?:2|3|4|5|6|7).*evidence\.json/i;
          const privilegeForbidden = /SUPABASE_SERVICE_ROLE_KEY|SUPABASE_SERVICE_ROLE|service[_-]?role[_-]?(?:key|token|secret|password)/i;
          const executionVerbForbidden = /--(?:activate|apply|deploy|set-env)\b|process\.env\.REFERENCE_GRAPH_QUICK_RUNTIME\s*=|reference_graph_refresh_quick_runtime_projection/i;
          for (const file of files) {
            const source = fs.readFileSync(file, 'utf8');
            if (benchmarkForbidden.test(source)) throw new Error(`P12 benchmark leakage detected in ${file}`);
            if (privilegeForbidden.test(source)) throw new Error(`P12 privileged runtime credential detected in ${file}`);
            if (executionVerbForbidden.test(source)) throw new Error(`P12 executable activation path detected in ${file}`);
          }
          const query = fs.readFileSync('knowledge/design-references/scripts/query.mjs', 'utf8');
          if (!/REFERENCE_GRAPH_QUICK_RUNTIME\s*\|\|\s*["']legacy["']/.test(query)
            || !/graphMode\s*===\s*["']graph["']/.test(query)) {
            throw new Error('repository default graph mode changed');
          }
          const migrations = fs.readdirSync('reference-graph/schema');
          if (migrations.some((name) => /^010_/.test(name))) {
            throw new Error('migration 010 is forbidden in P12');
          }
          console.log('P12 activation authority remains non-executable and default-off');
          NODE

'''
          if workflow.count(step_anchor) != 1:
              raise SystemExit('unexpected P12 insertion anchor count')
          workflow = workflow.replace(step_anchor, p12_steps + step_anchor, 1)
          workflow_path.write_text(workflow)

          readme_path = Path('reference-graph/README.md')
          readme = readme_path.read_text()
          section = r'''

## P12 activation authority preflight

P12 separates **technical readiness** from execution authority. The read-only activation preflight binds the final P11 evidence head, tested P11 implementation, dedicated target, current projection snapshot, production query/router hashes, publishable-only runtime contract, exact parity requirements, timeout, and rollback rule into one deterministic `binding_hash`.

A successful P12 receipt may report `preflight_ready: true`. That still does **not** switch normal production traffic or create a deployment grant. P12 permanently records `grant_state: not-issued`, `activation_authorized: false`, `activation_performed: false`, `repository_default_graph_enabled: false`, and `production_source: legacy-control`.

The P12 operator is read-only: it can print the binding plan, verify repository hashes, and finalize an externally gathered secret-free live snapshot. It cannot refresh the P10 projection, mutate database state, change environment configuration, deploy, or activate routing. Standard and deep remain legacy-only, and quick remains default-off unless a later phase receives separate explicit operator/deployment authority referencing the exact P12 `binding_hash`.

P12 adds no schema migration after `009_reference_graph_runtime_projection.sql`. A stale projection fails the current-date preflight; P12 does not refresh it to manufacture readiness.
'''
          if '## P12 activation authority preflight' not in readme:
              readme_path.write_text(readme.rstrip() + section + '\n')

          Path('reference-graph/.p12-governance.yml').write_text(workflow_path.read_text())
          Path('reference-graph/.p12-readme.md').write_text(readme_path.read_text())
          PY
          git config user.name "Wibias"
          git config user.email "37517432+Wibias@users.noreply.github.com"
          git add reference-graph/.p12-governance.yml reference-graph/.p12-readme.md
          git commit -m "chore: stage P12 permanent governance blobs"
          git push origin HEAD:agent/reference-graph-p12
