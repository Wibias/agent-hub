name: Reference Graph P0 verification

on:
  push:
    branches:
      - agent/reference-graph-p0

permissions:
  contents: read

jobs:
  reference-graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test reference graph foundation
        run: node --test tests/reference-graph/*.test.mjs
