name: P6 stage targeted CI workflow blob

on:
  push:
    branches:
      - agent/reference-graph-p6
    paths:
      - .github/workflows/p6-apply-ci-smoke-fix.yml

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/reference-graph-p6
          fetch-depth: 0
      - name: Stage corrected workflow as ordinary repository blob
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/verify-reference-graph.yml')
          staged = Path('reference-graph/.p6-fixed-governance.yml')
          text = source.read_text()
          old = "            array_fill(0.01::real, array[384])::extensions.vector::text,"
          new = "            ('[' || array_to_string(array_fill(0.01::real, array[384]), ',') || ']'),"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one caller-side vector cast, found {count}')
          staged.write_text(text.replace(old, new))
          PY
          git config user.name "Wibias"
          git config user.email "37517432+Wibias@users.noreply.github.com"
          git add reference-graph/.p6-fixed-governance.yml
          git commit -m "chore: stage corrected P6 governance blob"
          git push origin HEAD:agent/reference-graph-p6
