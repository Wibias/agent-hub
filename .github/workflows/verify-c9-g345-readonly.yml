name: C9 G3 G4 G5 read-only authorization integration
on:
  push:
    branches: [codex/c9-g3-offline-review]
    paths:
      - 'experiments/c9/g345-review/**'
      - '.github/workflows/verify-c9-g345-readonly.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: windows-2022
    timeout-minutes: 12
    defaults:
      run:
        working-directory: experiments/c9/g345-review
    env:
      AGENTHUB_G345_REVIEW_ONLY: DISPOSABLE_WINDOWS_TEST
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.100'
      - name: Native G3 ticket, G4 reservation and G5 retained file proof
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sdk = (dotnet --version).Trim()
          if ($sdk -cne '10.0.100') { throw "Unexpected SDK: $sdk" }
          if ($env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or $env:RUNNER_OS -cne 'Windows') { throw 'Non disposable Windows runner' }
          dotnet run --project tests/AgentHub.C9.G345.Review.Tests.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { throw "G345 integration tests failed: $LASTEXITCODE" }
          Write-Host "C9_G345_REVIEW_PASS SHA=$env:GITHUB_SHA SDK=$sdk"
          Write-Host 'NO_BROKER NO_SERVICE NO_PIPE NO_TARGET_WRITE NO_COMMIT G3_G4_G5_HOLD PRODUCTION_NO_GO'
