name: Memory Candidate Failure Redaction

on:
  pull_request:
    paths:
      - "memory-engine/codex-candidate-process-error.mjs"
      - "memory-engine/codex-candidate-launch.mjs"
      - "scripts/doctor-codex-candidate-executable.mjs"
      - "scripts/doctor-codex-candidate-live.mjs"
      - "scripts/doctor-memory-candidate-sandbox.mjs"
      - "tests/memory-engine/memory-candidate-sandbox.test.mjs"
      - "tests/memory-engine/codex-candidate-live-probe.test.mjs"
      - "tests/memory-engine/codex-candidate-launch.test.mjs"
      - "tests/memory-engine/codex-candidate-executable-probe.test.mjs"
      - "scripts/judge-memory-candidates.mjs"
      - "scripts/judge-memory-relations.mjs"
      - "tests/memory-engine/codex-candidate-relation-runtime.test.mjs"
      - "tests/memory-engine/codex-candidate-process-error.test.mjs"
      - ".github/workflows/verify-memory-candidate-errors.yml"
  push:
    branches: [main]
    paths:
      - "memory-engine/codex-candidate-process-error.mjs"
      - "memory-engine/codex-candidate-launch.mjs"
      - "scripts/doctor-codex-candidate-executable.mjs"
      - "scripts/doctor-codex-candidate-live.mjs"
      - "scripts/doctor-memory-candidate-sandbox.mjs"
      - "tests/memory-engine/memory-candidate-sandbox.test.mjs"
      - "tests/memory-engine/codex-candidate-live-probe.test.mjs"
      - "tests/memory-engine/codex-candidate-launch.test.mjs"
      - "tests/memory-engine/codex-candidate-executable-probe.test.mjs"
      - "scripts/judge-memory-candidates.mjs"
      - "scripts/judge-memory-relations.mjs"
      - "tests/memory-engine/codex-candidate-relation-runtime.test.mjs"
      - "tests/memory-engine/codex-candidate-process-error.test.mjs"
      - ".github/workflows/verify-memory-candidate-errors.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Verify safe candidate subprocess errors
        run: |
          node --check memory-engine/codex-candidate-process-error.mjs
          node --check memory-engine/codex-candidate-launch.mjs
          node --check scripts/judge-memory-candidates.mjs
          node --check scripts/judge-memory-relations.mjs
          node --check scripts/doctor-codex-candidate-executable.mjs
          node --check scripts/doctor-codex-candidate-live.mjs
          node --check scripts/doctor-memory-candidate-sandbox.mjs
          node --test \
            tests/memory-engine/codex-candidate-process-error.test.mjs \
            tests/memory-engine/codex-candidate-launch.test.mjs \
            tests/memory-engine/codex-candidate-executable-probe.test.mjs \
            tests/memory-engine/codex-candidate-live-probe.test.mjs \
            tests/memory-engine/codex-candidate-relation-runtime.test.mjs \
            tests/memory-engine/memory-candidate-sandbox.test.mjs \
            tests/memory-engine/memory-candidate-judge.test.mjs

  windows-launch:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Test shell-free native and npm-shim launch paths on Windows
        run: |
          node --check memory-engine/codex-candidate-launch.mjs
          node --test tests/memory-engine/codex-candidate-launch.test.mjs tests/memory-engine/codex-candidate-executable-probe.test.mjs tests/memory-engine/codex-candidate-live-probe.test.mjs tests/memory-engine/codex-candidate-relation-runtime.test.mjs tests/memory-engine/memory-candidate-sandbox.test.mjs
