name: P17 one-shot index regeneration

on:
  push:
    branches:
      - agent/reference-graph-p17

permissions:
  contents: write

jobs:
  regenerate:
    if: ${{ !contains(github.event.head_commit.message, '[p17-generated]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/reference-graph-p17
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Route production query command through P17 wrapper
        shell: python
        run: |
          from pathlib import Path

          old = "node knowledge/design-references/scripts/query.mjs"
          new = "node knowledge/design-references/scripts/query-runtime.mjs"
          for name in [
              "skills/design-with-ai/references/reference-library.md",
              "knowledge/build-index.mjs",
          ]:
              path = Path(name)
              text = path.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"expected direct query command missing from {name}")
              path.write_text(text.replace(old, new), encoding="utf-8")
      - name: Regenerate knowledge index
        run: node knowledge/build-index.mjs
      - name: Commit generated projection
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skills/design-with-ai/references/reference-library.md knowledge/build-index.mjs knowledge/index.json knowledge/INDEX.md
          git diff --cached --check
          git commit -m "feat: route design reference queries through P17 runtime [p17-generated]"
          git push origin HEAD:agent/reference-graph-p17
