name: Memory preview attested package

# Manual main-only build. No service installation or evidence transfer.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/main' && github.repository == 'Wibias/agent-hub'
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'ga'
      - name: Build and verify no-write preview
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD) -cne $env:GITHUB_SHA) { throw 'Checkout SHA mismatch' }
          $stage = Join-Path $env:RUNNER_TEMP 'memory-preview'
          New-Item -ItemType Directory -Path $stage | Out-Null
          $package = Join-Path $stage 'package'
          pwsh -NoProfile -File ./scripts/prepare-memory-review-local-preview.ps1 -Action Prepare -PackageDirectory $package -RepositoryDirectory $env:GITHUB_WORKSPACE
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
          $verified = pwsh -NoProfile -File ./scripts/prepare-memory-review-local-preview.ps1 -Action Verify -PackageDirectory $package -RepositoryDirectory $env:GITHUB_WORKSPACE
          if ($LASTEXITCODE -ne 0) { throw 'Verify failed' }
          $manifest = $verified | ConvertFrom-Json
          if ($manifest.commitSha -cne $env:GITHUB_SHA -or $manifest.claimsEnabled -ne $false -or $manifest.serviceInstalled -ne $false) { throw 'Preview contract mismatch' }
          Copy-Item -LiteralPath ./scripts/install-memory-review-local-preview.ps1 -Destination $stage
          $zip = Join-Path $env:RUNNER_TEMP 'agenthub-memory-preview.zip'
          Compress-Archive -LiteralPath @($package, (Join-Path $stage 'install-memory-review-local-preview.ps1')) -DestinationPath $zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agenthub-memory-preview
          path: ${{ runner.temp }}/agenthub-memory-preview.zip
          if-no-files-found: error
          retention-days: 14

  attest:
    needs: build
    if: github.ref == 'refs/heads/main' && github.repository == 'Wibias/agent-hub'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: agenthub-memory-preview
          path: preview
      # Sign bytes only. Never execute the downloaded package.
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: preview/agenthub-memory-preview.zip
      - name: Verify exact workflow, repository, main ref and source SHA
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if gh attestation verify preview/agenthub-memory-preview.zip \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/build-memory-preview-attested.yml" \
              --source-ref refs/heads/main --source-digest "$GITHUB_SHA" \
              --deny-self-hosted-runners; then
              exit 0
            fi
            sleep 3
          done
          exit 1
