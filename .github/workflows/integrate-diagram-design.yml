name: Integrate diagram design

on:
  pull_request:
    paths:
      - '.github/workflows/integrate-diagram-design.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Patch curated README discovery
        run: |
          python3 - <<'PY'
          from pathlib import Path
          readme = Path('README.md')
          lines = readme.read_text(encoding='utf-8').splitlines()
          if not any('<!-- skill-doc:diagram-design -->' in line for line in lines):
              for i, line in enumerate(lines):
                  if '<!-- skill-doc:playwright -->' in line:
                      lines.insert(i, '| <!-- skill-doc:diagram-design -->[**diagram-design**](skills/diagram-design/SKILL.md) | Draw, brand, polish, and export publishable diagrams as self-contained HTML/SVG/PNG while preserving the underlying semantic owner. | “Turn this approved architecture into a polished publishable diagram.” |')
                      break
              else:
                  raise SystemExit('README playwright anchor not found')
              readme.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
      - name: Regenerate knowledge index
        run: node knowledge/build-index.mjs
      - name: Commit deterministic README and index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- README.md knowledge/INDEX.md knowledge/index.json
          git commit -m "chore: wire diagram-design discovery and index"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
