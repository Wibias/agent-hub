name: Integrate diagram design

on:
  pull_request:
    paths:
      - '.github/workflows/integrate-diagram-design.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Patch curated discovery and release governance
        run: |
          python3 - <<'PY'
          from pathlib import Path

          readme = Path('README.md')
          lines = readme.read_text(encoding='utf-8').splitlines()
          if not any('<!-- skill-doc:diagram-design -->' in line for line in lines):
              for i, line in enumerate(lines):
                  if '<!-- skill-doc:playwright -->' in line:
                      lines.insert(i, '| <!-- skill-doc:diagram-design -->[**diagram-design**](skills/diagram-design/SKILL.md) | Draw, brand, polish, and export publishable diagrams as self-contained HTML/SVG/PNG while preserving the underlying semantic owner. | “Turn this approved architecture into a polished publishable diagram.” |')
                      break
              else:
                  raise SystemExit('README playwright anchor not found')
              readme.write_text('\n'.join(lines) + '\n', encoding='utf-8')

          workflow = Path('.github/workflows/verify-skill-routing.yml')
          text = workflow.read_text(encoding='utf-8')
          if 'Validate diagram design skill structure' not in text:
              anchor = '      - name: Test bounded design guidance query\n'
              if anchor not in text:
                  raise SystemExit('release governance anchor not found')
              block = (
                  '      - name: Validate diagram design skill structure\n'
                  '        run: node skills/skill-ratchet/scripts/skill-ratchet.mjs validate --skill-root skills/diagram-design\n\n'
                  '      - name: Validate diagram design vendored helpers\n'
                  '        run: |\n'
                  '          python3 -m py_compile skills/diagram-design/scripts/*.py\n'
                  '          python3 skills/diagram-design/scripts/self_check.py skills/diagram-design/assets/example-architecture.html\n\n'
                  '      - name: Validate diagram design eval JSON\n'
                  '        run: |\n'
                  '          node -e "const fs=require(\'fs\'); JSON.parse(fs.readFileSync(\'skills/diagram-design/tests/evals/regression-lock.json\',\'utf8\')); for (const p of [\'skills/diagram-design/tests/evals/cases.jsonl\',\'skills/diagram-design/tests/evals/regression-cases.jsonl\',\'tests/skill-catalog/diagram-design-routing.jsonl\']) fs.readFileSync(p,\'utf8\').split(/\\\\r?\\\\n/).filter(Boolean).forEach(JSON.parse)"\n\n'
              )
              workflow.write_text(text.replace(anchor, block + anchor, 1), encoding='utf-8')
          PY
      - name: Regenerate knowledge index
        run: node knowledge/build-index.mjs
      - name: Commit deterministic integration files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- README.md .github/workflows/verify-skill-routing.yml knowledge/INDEX.md knowledge/index.json
          git commit -m "chore: wire diagram-design into agent hub"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
