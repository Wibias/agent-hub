name: P11 live activation rerun

on:
  push:
    branches:
      - agent/reference-graph-p11
    paths:
      - .github/workflows/p11-live-activation-rerun.yml

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run current-date P11 activation canary
        run: |
          export SUPABASE_URL='https://vrznfnxzlxaavpqbzbzd.supabase.co'
          export SUPABASE_PUBLISHABLE_KEY="$(python3 - <<'PY'
          from pathlib import Path
          import re
          text = Path('.github/workflows/p11-live-activation-canary.yml').read_text()
          match = re.search(r'^\s*SUPABASE_PUBLISHABLE_KEY:\s*(\S+)\s*$', text, re.M)
          if not match:
              raise SystemExit('publishable canary value not found')
          print(match.group(1))
          PY
          )"
          export REFERENCE_DATE='2026-10-24'
          node reference-graph/p11-live-activation-canary.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: p11-live-activation-canary-green
          path: /tmp/p11-live-activation-canary.json
          if-no-files-found: error
