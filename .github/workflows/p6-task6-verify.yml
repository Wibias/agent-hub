name: P6 implementation verification

on:
  push:
    branches:
      - agent/reference-graph-p6
    paths:
      - .github/workflows/p6-task6-verify.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run design-reference library suite
        run: node --test knowledge/design-references/tests/library.test.mjs
      - name: Verify current control
        run: node reference-graph/cli/p5-live-quality.mjs --current-control --reference-date 2026-10-23
      - name: Scan Reference Graph secrets
        run: python3 skills/security-review-redirect/scripts/scan_secrets.py reference-graph
