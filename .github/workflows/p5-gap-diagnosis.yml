name: P5 control gap diagnosis

on:
  push:
    branches:
      - agent/reference-graph-p5

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Diagnose current control coverage
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { loadRecords, isFresh, TAXONOMY } from './knowledge/design-references/scripts/lib.mjs';
          import { selectRecords } from './knowledge/design-references/scripts/selection.mjs';

          const now = new Date('2026-10-23T12:00:00.000Z');
          const quickDefaultLimit = TAXONOMY.profiles.quick.default;
          const quickPlatformFloor = Math.ceil(quickDefaultLimit / 2);
          const cases = JSON.parse(fs.readFileSync('./reference-graph/shadow-cases.json', 'utf8'));
          const records = loadRecords();
          const eligible = records.filter((record) =>
            record.reviewStatus === 'reviewed'
            && ['AVAILABLE', 'PAYWALLED'].includes(record.accessStatus)
            && isFresh(record, now)
          );
          const stale = records.filter((record) => record.reviewStatus === 'stale');

          const gaps = [];
          for (const request of cases) {
            const selection = selectRecords(records, request, { now });
            if (selection.coverageGaps.length === 0) continue;
            gaps.push({
              case_id: request.id,
              surface: request.surface,
              platform: request.platform,
              limit: request.limit,
              coverage: selection.coverage,
              coverage_gaps: selection.coverageGaps,
              selected_ids: selection.selected.map((record) => record.id),
            });
          }

          const taxonomyCells = [];
          for (const surface of Object.keys(TAXONOMY.surfaceFamilies).sort()) {
            for (const platform of Object.keys(TAXONOMY.platformTargets).sort()) {
              const freshExact = eligible.filter((record) =>
                record.surfaceFamily === surface && record.platform === platform
              );
              const staleExact = stale.filter((record) =>
                record.surfaceFamily === surface && record.platform === platform
              );
              taxonomyCells.push({
                surface,
                platform,
                quick_platform_floor: quickPlatformFloor,
                fresh_exact_cell_count: freshExact.length,
                deficit_to_quick_platform_floor: Math.max(0, quickPlatformFloor - freshExact.length),
                stale_exact_cell_count: staleExact.length,
                stale_available_count: staleExact.filter((record) => ['AVAILABLE', 'PAYWALLED'].includes(record.accessStatus)).length,
                stale_available_ids: staleExact
                  .filter((record) => ['AVAILABLE', 'PAYWALLED'].includes(record.accessStatus))
                  .map((record) => record.id)
                  .sort(),
              });
            }
          }

          const output = {
            reference_time: now.toISOString(),
            record_count: records.length,
            eligible_count: eligible.length,
            stale_count: stale.length,
            quick_default_limit: quickDefaultLimit,
            quick_platform_floor: quickPlatformFloor,
            gap_case_count: gaps.length,
            gaps,
            taxonomy_deficit_cells: taxonomyCells.filter((cell) => cell.deficit_to_quick_platform_floor > 0),
          };
          fs.writeFileSync('p5-gap-diagnosis.json', `${JSON.stringify(output, null, 2)}\n`);
          console.log(JSON.stringify(output, null, 2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: p5-gap-diagnosis
          path: p5-gap-diagnosis.json
          if-no-files-found: error
