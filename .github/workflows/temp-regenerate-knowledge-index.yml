name: Temporary regenerate knowledge index

on:
  push:
    branches:
      - chore/sync-upstreams-2026-10-13
    paths:
      - .github/workflows/temp-regenerate-knowledge-index.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: chore/sync-upstreams-2026-10-13
          fetch-depth: 0

      - name: Regenerate knowledge index
        run: node knowledge/build-index.mjs

      - name: Remove temporary workflow and commit generated index
        shell: bash
        run: |
          rm .github/workflows/temp-regenerate-knowledge-index.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add knowledge/INDEX.md knowledge/index.json .github/workflows/temp-regenerate-knowledge-index.yml
          git diff --cached --check
          git commit -m "chore: regenerate knowledge index"
          git push origin HEAD:chore/sync-upstreams-2026-10-13
