name: Memory Graph D8 Evidence Coverage Audit

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: memory-graph-d8-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify D8 CLI syntax
        run: node --check scripts/audit-memory-graph-d8.mjs
      - name: Verify D8 Evidence coverage audit and Memory Graph regressions
        run: |
          node --test \
            tests/memory-engine/memory-graph-d8*.test.mjs \
            tests/memory-engine/memory-graph-d7*.test.mjs \
            tests/memory-engine/memory-graph-diagnostics*.test.mjs \
            tests/memory-engine/memory-console-git*.test.mjs \
            tests/memory-engine/memory-graph-v2*.test.mjs \
            tests/memory-engine/git-freshness-helper.test.mjs
