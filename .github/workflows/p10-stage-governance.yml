name: P10 stage permanent governance

on:
  push:
    branches:
      - agent/reference-graph-p10
    paths:
      - .github/workflows/p10-stage-governance.yml

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/reference-graph-p10
          fetch-depth: 0
      - name: Build staged governance and P10 README docs
        run: |
          python3 reference-graph/.p10-stage-governance.py
          git config user.name "Wibias"
          git config user.email "37517432+Wibias@users.noreply.github.com"
          git add reference-graph/.p10-fixed-governance.yml reference-graph/README.md
          git commit -m "ci: stage P10 permanent governance"
          git push origin HEAD:agent/reference-graph-p10
