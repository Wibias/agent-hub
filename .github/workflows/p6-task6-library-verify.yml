name: P6 task6 library verify

on:
  push:
    branches:
      - agent/reference-graph-p6
    paths:
      - .github/workflows/p6-task6-library-verify.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/reference-graph-p6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run design-reference library regression suite
        run: node --test knowledge/design-references/tests/library.test.mjs
