name: Refresh diagram merge metadata

on:
  push:
    branches:
      - agent/diagram-design-p3

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/diagram-design-p3
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Merge shared registry surfaces
        run: |
          node <<'NODE'
          const fs = require('fs');

          const readmePath = 'README.md';
          let readme = fs.readFileSync(readmePath, 'utf8');
          const diagramRow = '| <!-- skill-doc:diagram-design -->[**diagram-design**](skills/diagram-design/SKILL.md) | Draw, brand, polish, and export publishable diagrams as self-contained HTML/SVG/PNG while preserving the underlying semantic owner. | “Turn this approved architecture into a polished publishable diagram.” |';
          if (!readme.includes('<!-- skill-doc:diagram-design -->')) {
            const lines = readme.split(/\r?\n/);
            const anchor = lines.findIndex((line) => line.includes('<!-- skill-doc:video-production -->'));
            if (anchor < 0) throw new Error('README video-production anchor not found');
            lines.splice(anchor, 0, diagramRow);
            readme = lines.join('\n');
            if (!readme.endsWith('\n')) readme += '\n';
            fs.writeFileSync(readmePath, readme);
          }

          const workflowPath = '.github/workflows/verify-skill-routing.yml';
          let workflow = fs.readFileSync(workflowPath, 'utf8');
          if (!workflow.includes('Validate diagram-design skill structure')) {
            const anchor = '      - name: Validate video production skill structure';
            const block = [
              '      - name: Validate diagram-design skill structure',
              '        shell: pwsh',
              '        run: pwsh -NoProfile -ExecutionPolicy Bypass -File skills/diagram-design/tests/validate.ps1',
              '',
            ].join('\n');
            if (!workflow.includes(anchor)) throw new Error('Release-governance video-production anchor not found');
            workflow = workflow.replace(anchor, block + anchor);
            fs.writeFileSync(workflowPath, workflow);
          }
          NODE

      - name: Regenerate knowledge index
        run: node knowledge/build-index.mjs

      - name: Verify generated files
        run: |
          git diff --check
          grep -q '<!-- skill-doc:diagram-design -->' README.md
          grep -q 'Validate diagram-design skill structure' .github/workflows/verify-skill-routing.yml
          grep -q 'skills/diagram-design/SKILL.md' knowledge/INDEX.md
          grep -q 'skills/diagram-design/SKILL.md' knowledge/index.json
          grep -q 'skills/video-production/SKILL.md' knowledge/INDEX.md
          grep -q 'skills/video-production/SKILL.md' knowledge/index.json

      - name: Commit refreshed shared files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md .github/workflows/verify-skill-routing.yml knowledge/INDEX.md knowledge/index.json
          if git diff --cached --quiet; then
            echo 'No shared-file refresh required.'
          else
            git commit -m 'Resolve diagram-design shared metadata conflicts'
            git push origin HEAD:agent/diagram-design-p3
          fi
