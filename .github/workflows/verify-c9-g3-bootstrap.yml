name: C9 G3 trust-bootstrap offline review
on:
  push:
    branches: [codex/c9-g3-offline-review]
    paths:
      - 'experiments/c9/g3-bootstrap/src/TrustBootstrap.cs'
      - 'experiments/c9/g3-bootstrap/src/AgentHub.C9.G3.Bootstrap.csproj'
      - 'experiments/c9/g3-bootstrap/tests/BootstrapProgram.cs'
      - 'experiments/c9/g3-bootstrap/tests/AgentHub.C9.G3.Bootstrap.Tests.csproj'
      - '.github/workflows/verify-c9-g3-bootstrap.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bootstrap-offline:
    runs-on: windows-2022
    timeout-minutes: 10
    defaults:
      run:
        working-directory: experiments/c9/g3-bootstrap
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.100'
      - name: Exact SDK and targeted bootstrap contract tests only
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sdk = (dotnet --version).Trim()
          if ($sdk -cne '10.0.100') { throw "Unexpected SDK: $sdk" }
          dotnet run --project tests/AgentHub.C9.G3.Bootstrap.Tests.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { throw "G3 bootstrap tests failed: $LASTEXITCODE" }
          Write-Host "C9_G3_BOOTSTRAP_REVIEW_PASS SHA=$env:GITHUB_SHA SDK=$sdk"
          Write-Host 'NO_ISSUER_ENROLLED NO_SCM G3_HOLD PRODUCTION_NO_GO'
