name: P6 stage transactional measurement SQL

on:
  push:
    branches:
      - agent/reference-graph-p6-evidence-run
    paths:
      - .github/workflows/p6-stage-measurement-sql.yml

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/reference-graph-p6-evidence-run
          fetch-depth: 0
      - name: Materialize SHA-pinned measurement SQL
        env:
          TEMPLATE_B64: 
        run: |
          python3 - <<'PY'
          import base64
          import gzip
          import hashlib
          import json
          import os
          from pathlib import Path

          template = gzip.decompress(base64.b64decode(os.environ['TEMPLATE_B64'])).decode()
          data_sha = os.popen('git rev-parse HEAD').read().strip()
          if len(data_sha) != 40:
              raise SystemExit('invalid data SHA')
          sql = template.replace('__DATA_SHA__', data_sha)
          if '__DATA_SHA__' in sql:
              raise SystemExit('unresolved data SHA placeholder')
          out = Path('reference-graph/evidence-run')
          sql_path = out / 'p6-measurement.sql'
          sql_path.write_text(sql)
          manifest = {
              'schema_version': 'reference-graph.p6-measurement-sql-manifest.v1',
              'data_sha': data_sha,
              'sql_path': 'reference-graph/evidence-run/p6-measurement.sql',
              'sql_md5': hashlib.md5(sql.encode()).hexdigest(),
              'sql_sha256': hashlib.sha256(sql.encode()).hexdigest(),
              'transactional': True,
              'persistent_database_writes': False,
          }
          (out / 'p6-measurement-sql-manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          print(json.dumps(manifest, indent=2))
          PY
      - name: Commit measurement SQL
        run: |
          git config user.name "Wibias"
          git config user.email "37517432+Wibias@users.noreply.github.com"
          git add reference-graph/evidence-run/p6-measurement.sql reference-graph/evidence-run/p6-measurement-sql-manifest.json
          git commit -m "chore: stage transactional P6 measurement SQL"
          git push origin HEAD:agent/reference-graph-p6-evidence-run
